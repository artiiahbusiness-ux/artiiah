<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artiiah Sales & Expense System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/dexie@4.0.10/dist/dexie.min.js"></script>
<script src="https://unpkg.com/dexie-export-import@2.0.0/dist/dexie-export-import.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --bg:#eef1f8;
  --mesh:radial-gradient(at 12% 8%, rgba(99,102,241,.18) 0px, transparent 45%),radial-gradient(at 88% 4%, rgba(168,85,247,.16) 0px, transparent 50%),radial-gradient(at 4% 92%, rgba(14,165,233,.14) 0px, transparent 45%),radial-gradient(at 96% 96%, rgba(16,185,129,.13) 0px, transparent 50%);
  --surface:rgba(255,255,255,.82);--surface-solid:#ffffff;--surface-2:rgba(245,247,252,.9);--surface-3:rgba(236,240,250,.9);
  --glass:rgba(255,255,255,.7);--glass-border:rgba(255,255,255,.9);--border:rgba(15,23,42,.07);--border-strong:rgba(15,23,42,.13);
  --text:#070b18;--text-dim:#5a6480;--text-faint:#98a0b6;
  --primary:#5b5bf6;--primary-2:#8b5cf6;--primary-hover:#4b4be0;--primary-soft:rgba(91,91,246,.1);--primary-tint:rgba(91,91,246,.14);
  --success:#059669;--success-soft:rgba(5,150,105,.12);--warning:#d97706;--warning-soft:rgba(217,119,6,.13);
  --danger:#e11d48;--danger-soft:rgba(225,29,72,.12);--info:#0284c7;--info-soft:rgba(2,132,199,.12);
  --purple:#9333ea;--purple-soft:rgba(147,51,234,.12);
  --shadow-xs:0 1px 2px rgba(15,23,42,.04);--shadow-sm:0 2px 8px -2px rgba(15,23,42,.06), 0 1px 3px -1px rgba(15,23,42,.04);
  --shadow:0 12px 32px -12px rgba(15,23,42,.14), 0 4px 12px -4px rgba(15,23,42,.06);
  --shadow-lg:0 32px 64px -20px rgba(15,23,42,.24), 0 12px 32px -12px rgba(15,23,42,.1);
  --glow:0 8px 28px -8px rgba(91,91,246,.5);
  --radius-xs:10px;--radius-sm:14px;--radius:18px;--radius-lg:22px;--radius-xl:28px;--radius-2xl:36px;
  --rail:76px;--rail-expanded:240px;--ease:cubic-bezier(.16,1,.3,1);--ease-bounce:cubic-bezier(.34,1.56,.64,1);
}
[data-theme="dark"]{
  --bg:#05070f;
  --mesh:radial-gradient(at 12% 8%, rgba(91,91,246,.22) 0px, transparent 45%),radial-gradient(at 88% 4%, rgba(168,85,247,.18) 0px, transparent 50%),radial-gradient(at 4% 92%, rgba(14,165,233,.16) 0px, transparent 45%),radial-gradient(at 96% 96%, rgba(16,185,129,.14) 0px, transparent 50%);
  --surface:rgba(15,19,35,.75);--surface-solid:#0d1222;--surface-2:rgba(20,26,46,.85);--surface-3:rgba(28,36,60,.9);
  --glass:rgba(15,19,35,.6);--glass-border:rgba(255,255,255,.08);--border:rgba(255,255,255,.06);--border-strong:rgba(255,255,255,.12);
  --text:#eef2fb;--text-dim:#96a0bd;--text-faint:#697190;
  --primary:#7c7cf9;--primary-2:#a78bfa;--primary-hover:#9494ff;--primary-soft:rgba(124,124,249,.14);--primary-tint:rgba(124,124,249,.18);
  --success:#34d399;--success-soft:rgba(52,211,153,.14);--warning:#fbbf24;--warning-soft:rgba(251,191,36,.14);
  --danger:#fb7185;--danger-soft:rgba(251,113,133,.14);--info:#38bdf8;--info-soft:rgba(56,189,248,.14);
  --purple:#c084fc;--purple-soft:rgba(192,132,252,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow-x:hidden}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);background-image:var(--mesh);background-attachment:fixed;color:var(--text);font-size:14px;line-height:1.5;transition:background-color .35s var(--ease), color .35s var(--ease);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
input,select,textarea{font-family:inherit}
::selection{background:var(--primary-tint);color:var(--text)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint);background-clip:padding-box;border:2px solid transparent}
.app{display:flex;min-height:100vh}
.sidebar{position:fixed;top:18px;left:18px;bottom:18px;width:var(--rail);background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--glass-border);border-radius:var(--radius-xl);padding:18px 12px;display:flex;flex-direction:column;z-index:40;overflow:hidden;box-shadow:var(--shadow-lg);transition:width .35s var(--ease), box-shadow .35s var(--ease);}
.sidebar:hover,.sidebar.pinned{width:var(--rail-expanded)}
.sidebar::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,.4), transparent 40%);pointer-events:none;opacity:.6;}
[data-theme="dark"] .sidebar::before{background:linear-gradient(180deg, rgba(255,255,255,.06), transparent 40%)}
.brand{display:flex;align-items:center;gap:14px;padding:6px 6px 20px;border-bottom:1px solid var(--border);margin-bottom:16px;white-space:nowrap;}
.brand-logo{width:44px;height:44px;flex-shrink:0;border-radius:14px;background:conic-gradient(from 200deg at 50% 50%, #5b5bf6, #a855f7, #ec4899, #f59e0b, #5b5bf6);display:grid;place-items:center;color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;letter-spacing:-.04em;box-shadow:0 8px 24px -8px rgba(91,91,246,.6), inset 0 1px 0 rgba(255,255,255,.35);position:relative;overflow:hidden;}
.brand-logo img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:2}
.brand-logo::after{content:'';position:absolute;inset:2px;border-radius:12px;background:linear-gradient(135deg, rgba(255,255,255,.25), transparent 50%);pointer-events:none;z-index:1;}
.brand-text{opacity:0;transform:translateX(-8px);transition:opacity .25s var(--ease), transform .25s var(--ease);}
.sidebar:hover .brand-text,.sidebar.pinned .brand-text{opacity:1;transform:translateX(0)}
.brand-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;letter-spacing:-.03em;line-height:1.1;background:linear-gradient(135deg, var(--text) 0%, var(--primary) 130%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.brand-sub{font-size:11px;color:var(--text-dim);margin-top:2px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow:hidden;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;font-size:13.5px;font-weight:600;color:var(--text-dim);transition:all .25s var(--ease);text-align:left;width:100%;position:relative;white-space:nowrap;}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);color:#fff;box-shadow:0 8px 24px -8px rgba(91,91,246,.55), inset 0 1px 0 rgba(255,255,255,.15);}
.nav-item.active::after{content:'';position:absolute;right:8px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.2);opacity:0;transition:opacity .25s;}
.sidebar:hover .nav-item.active::after,.sidebar.pinned .nav-item.active::after{opacity:1}
.nav-icon{width:20px;height:20px;stroke-width:2;flex-shrink:0;margin-left:2px}
.nav-label{opacity:0;transform:translateX(-8px);transition:opacity .25s var(--ease), transform .25s var(--ease);font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em;}
.sidebar:hover .nav-label,.sidebar.pinned .nav-label{opacity:1;transform:translateX(0)}
.sidebar-footer{padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px;}
.theme-toggle{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;font-size:13px;color:var(--text-dim);font-weight:600;transition:all .2s var(--ease);white-space:nowrap;}
.theme-toggle:hover{background:var(--surface-2);color:var(--text)}
.theme-label{opacity:0;transform:translateX(-8px);transition:opacity .25s var(--ease), transform .25s var(--ease);}
.sidebar:hover .theme-label,.sidebar.pinned .theme-label{opacity:1;transform:translateX(0)}
.main{flex:1;margin-left:calc(var(--rail) + 36px);padding:24px 32px 64px;min-width:0;transition:margin-left .35s var(--ease);}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:16px;}
.topbar-left{display:flex;align-items:center;gap:14px}
.menu-btn{display:none}
@media (min-width:961px){ .menu-btn{display:none !important;} }
.page-title{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;letter-spacing:-.045em;margin:0;line-height:1.05;background:linear-gradient(135deg, var(--text) 20%, var(--primary) 130%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.page-sub{color:var(--text-dim);font-size:13px;margin-top:4px;font-weight:500;letter-spacing:-.005em;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:14px;font-size:13px;font-weight:600;transition:all .22s var(--ease);white-space:nowrap;position:relative;font-family:'Space Grotesk',sans-serif;letter-spacing:-.005em;}
.btn-primary{background:linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);color:#fff;box-shadow:0 8px 22px -8px rgba(91,91,246,.6), inset 0 1px 0 rgba(255,255,255,.18);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 32px -10px rgba(91,91,246,.7), inset 0 1px 0 rgba(255,255,255,.18)}
.btn-primary:active{transform:translateY(0)}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border);backdrop-filter:blur(8px)}
.btn-ghost:hover{background:var(--surface-solid);border-color:var(--border-strong);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff;transform:translateY(-2px)}
.btn-success{background:var(--success-soft);color:var(--success)}
.btn-success:hover{background:var(--success);color:#fff;transform:translateY(-2px)}
.btn-warning{background:var(--warning-soft);color:var(--warning)}
.btn-warning:hover{background:var(--warning);color:#fff;transform:translateY(-2px)}
.btn-quote{background:linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);color:#fff;box-shadow:0 8px 22px -8px rgba(239,68,68,.6), inset 0 1px 0 rgba(255,255,255,.18);}
.btn-quote:hover{transform:translateY(-2px);box-shadow:0 14px 32px -10px rgba(239,68,68,.75), inset 0 1px 0 rgba(255,255,255,.18);}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:11px}
.btn-xs{padding:4px 8px;font-size:10.5px;border-radius:8px}
.btn-icon{padding:10px;border-radius:14px}
.card{background:var(--surface);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--border);border-radius:var(--radius-xl);padding:20px;box-shadow:var(--shadow-sm);transition:all .3s var(--ease);}
.card:hover{box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.card-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:10px;letter-spacing:-.02em;}
.card-sub{font-size:12.5px;color:var(--text-dim);margin:0 0 16px;line-height:1.55}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px;}
.kpi{background:var(--surface);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;position:relative;overflow:hidden;transition:all .3s var(--ease);box-shadow:var(--shadow-xs);}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--border-strong)}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg, var(--accent,var(--primary)), transparent);border-radius:3px;}
.kpi::after{content:'';position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle, color-mix(in srgb, var(--accent,var(--primary)) 15%, transparent), transparent 70%);pointer-events:none;}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);font-weight:700;}
.kpi-value{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin-top:6px;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1;}
.kpi-meta{font-size:11px;color:var(--text-faint);margin-top:4px;font-weight:500}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:11.5px;font-weight:700;color:var(--text-dim);letter-spacing:.01em}
.field input,.field select,.field textarea{padding:9px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface-solid);color:var(--text);font-size:13px;transition:all .2s var(--ease);width:100%;font-weight:500;}
.field input:hover,.field select:hover,.field textarea:hover{border-color:var(--border-strong)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-tint);background:var(--surface-solid);}
.field input[readonly]{background:linear-gradient(135deg, var(--primary-tint), transparent);cursor:not-allowed;font-weight:700;border-color:var(--primary);color:var(--primary);}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.table-wrap{overflow:auto;max-height:72vh;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface-solid);}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 12px;text-align:left;vertical-align:middle;white-space:normal;line-height:1.4}
th{background:var(--surface-2);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:3;}
td{border-bottom:1px solid var(--border)}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:'JetBrains Mono',monospace;font-size:12px;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:100px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb, currentColor 20%, transparent)}
.badge-paid{background:var(--success-soft);color:var(--success)}
.badge-dp{background:var(--warning-soft);color:var(--warning)}
.badge-pending{background:var(--danger-soft);color:var(--danger)}
.badge-info{background:var(--primary-soft);color:var(--primary)}
.badge-transfer{background:var(--surface-2);color:var(--text-dim)}
.badge-cancelled{background:rgba(120,113,108,.15);color:#78716c}
[data-theme="dark"] .badge-cancelled{background:rgba(168,162,158,.15);color:#a8a29e}
.badge-auto{background:var(--primary-soft);color:var(--primary);font-size:9.5px;padding:3px 8px;border-radius:8px;font-weight:800;letter-spacing:.06em;}
.badge-mop{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:100px;font-size:10px;font-weight:800;background:var(--primary-soft);color:var(--primary);white-space:nowrap;margin:2px 3px 2px 0;letter-spacing:.02em;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:10px 14px 10px 40px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);font-size:13px;transition:all .22s var(--ease);font-weight:500;backdrop-filter:blur(12px);}
.search input:hover{border-color:var(--border-strong)}
.search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-tint);background:var(--surface-solid)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none}
.modal-backdrop{position:fixed;inset:0;background:rgba(5,7,15,.6);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);display:grid;place-items:center;z-index:100;padding:16px;animation:fadeIn .25s var(--ease);}
.modal{background:var(--surface-solid);border:1px solid var(--glass-border);border-radius:var(--radius-2xl);box-shadow:var(--shadow-lg);width:100%;max-width:900px;max-height:94vh;display:flex;flex-direction:column;animation:modalIn .4s var(--ease-bounce);overflow:hidden;position:relative;}
.modal.modal-lg{max-width:980px; max-height:90vh;}
.modal.modal-quote{max-width:880px;max-height:94vh;}
.modal::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg, transparent, var(--primary), transparent);opacity:.6;}
.modal.modal-quote::before{background:linear-gradient(90deg, #f59e0b, #ef4444, #a78bfa);}
.modal-head{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:var(--surface-2);}
.modal-title{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;margin:0;letter-spacing:-.03em;display:flex;align-items:center;gap:12px;}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1;min-height:0}
.modal-foot{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:var(--surface-2);flex-shrink:0;}
.close-btn{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:var(--text-dim);transition:all .2s var(--ease);}
.close-btn:hover{background:var(--surface-3);color:var(--text);transform:rotate(90deg) scale(1.05)}
#modalForm { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
.modal-lg .modal-head{padding:12px 20px}
.modal-lg .modal-title{font-size:15px}
.modal-lg .modal-foot{padding:10px 20px;gap:8px}
.modal-lg .modal-foot .btn{padding:8px 16px;font-size:12px;border-radius:10px}
.modal-lg .close-btn{width:30px;height:30px;border-radius:8px}
.modal-lg .field label{font-size:10px}
.modal-lg .field input,.modal-lg .field select,.modal-lg .field textarea{padding:6px 10px;font-size:12px;border-radius:8px;}
.modal-lg .field textarea{min-height:36px;line-height:1.4}
.modal-lg .field input[readonly]{font-size:12px}
.modal-lg .sale-block-title{font-size:10px;margin-bottom:8px;letter-spacing:.06em}
.modal-lg .split-widget{padding:10px;border-radius:12px}
.modal-lg .split-chips{margin-bottom:8px;min-height:30px;gap:5px}
.modal-lg .split-chip{padding:4px 6px 4px 10px;font-size:11px;gap:6px}
.modal-lg .split-chip .mop{font-size:9.5px}
.modal-lg .split-chip .amt{font-size:11px}
.modal-lg .split-chip .x{width:18px;height:18px;font-size:9px}
.modal-lg .split-add select,.modal-lg .split-add input{padding:6px 10px;font-size:11px;border-radius:8px}
.modal-lg .split-add .btn{padding:6px 14px;font-size:11px;border-radius:8px}
.modal-lg .split-status{padding:6px 10px;font-size:10.5px;margin-top:8px;border-radius:8px}
.modal-lg .lp-hero{padding:12px 14px;border-radius:14px}
.modal-lg .lp-hero-label{font-size:9px}
.modal-lg .lp-hero-value{font-size:22px;margin-top:2px}
.modal-lg .lp-hero-sub{font-size:10px;margin-top:2px}
.modal-lg .lp-title{font-size:10px}
.modal-lg .lp-row{padding:7px 10px;border-radius:8px}
.modal-lg .lp-row-label{font-size:10px}
.modal-lg .lp-row-value{font-size:11px}
.modal-lg .lp-hint{font-size:9.5px;padding:8px 10px;border-radius:8px;line-height:1.4}
.toast-wrap{position:fixed;bottom:28px;right:28px;z-index:200;display:flex;flex-direction:column;gap:12px;pointer-events:none}
.toast{background:var(--surface-solid);border:1px solid var(--border);border-radius:16px;padding:14px 20px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:600;animation:slideInRight .4s var(--ease-bounce);min-width:280px;max-width:420px;pointer-events:auto;backdrop-filter:blur(20px);}
.toast.success{border-left:4px solid var(--success)}
.toast.error{border-left:4px solid var(--danger)}
.toast.info{border-left:4px solid var(--info)}
.toast-icon{width:22px;height:22px;flex-shrink:0}
.section-title{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--text-faint);margin:20px 0 12px;display:flex;align-items:center;gap:12px;}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg, var(--border), transparent);}
.section-title:first-child{margin-top:0}
.empty{padding:40px 20px;text-align:center;color:var(--text-dim)}
.empty-title{font-weight:700;color:var(--text);margin-bottom:6px;font-size:15px;font-family:'Space Grotesk',sans-serif}
.chart-wrap{position:relative;height:200px;display:flex;align-items:flex-end;gap:8px;padding:24px 0 36px;border-bottom:1px solid var(--border);}
.bar{flex:1;background:linear-gradient(180deg, var(--primary) 0%, var(--primary-2) 100%);border-radius:10px 10px 4px 4px;min-height:4px;position:relative;transition:all .35s var(--ease);animation:growUp .7s var(--ease);min-width:16px;box-shadow:0 4px 14px -4px rgba(91,91,246,.35);}
.bar:hover{filter:brightness(1.15);transform:scaleY(1.03);transform-origin:bottom}
.bar-label{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);text-align:center;font-size:10px;color:var(--text-faint);font-weight:700;white-space:nowrap;pointer-events:none;}
.bar-value{position:absolute;top:-24px;left:50%;transform:translateX(-50%);text-align:center;font-size:10px;color:var(--text-dim);font-weight:700;font-family:'JetBrains Mono',monospace;white-space:nowrap;pointer-events:none;}
.note-banner{background:linear-gradient(135deg, var(--primary-soft) 0%, var(--surface) 100%);border:1px solid var(--primary);border-radius:var(--radius);padding:14px 18px;font-size:12.5px;color:var(--primary);margin-bottom:16px;display:flex;gap:12px;align-items:flex-start;line-height:1.6;font-weight:500;backdrop-filter:blur(12px);}
.note-banner svg{flex-shrink:0;margin-top:2px}
.setup-banner{background:linear-gradient(135deg,#fef3c7 0%,#fde68a 50%,#fbcfe8 100%);border:1px solid var(--warning);border-radius:var(--radius-xl);padding:22px 24px;margin-bottom:20px;color:#78350f;box-shadow:var(--shadow);}
[data-theme="dark"] .setup-banner{background:linear-gradient(135deg,#422006 0%,#3b1d09 100%);color:#fde68a}
.setup-banner h3{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:12px;font-family:'Space Grotesk',sans-serif;letter-spacing:-.02em}
.setup-banner p{margin:0 0 14px;font-size:13.5px;line-height:1.65}
.setup-banner .actions{display:flex;gap:10px;flex-wrap:wrap}
.setup-banner .btn{background:#78350f;color:#fff;box-shadow:0 8px 20px -6px rgba(120,53,15,.5)}
.setup-banner .btn-ghost{background:rgba(255,255,255,.5);color:#78350f;border-color:#78350f}
[data-theme="dark"] .setup-banner .btn{background:#fde68a;color:#422006}
[data-theme="dark"] .setup-banner .btn-ghost{background:rgba(255,255,255,.1);color:#fde68a;border-color:#fde68a}
.hint{font-size:10.5px;color:var(--text-faint);margin-top:4px;line-height:1.45}
.label-flex{display:flex;justify-content:space-between;align-items:center;gap:8px}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;display:inline-block;vertical-align:middle;}
.dash-group{margin-bottom:16px;padding:18px 20px;background:var(--surface);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border-radius:var(--radius-2xl);border:1px solid var(--border);box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:box-shadow .3s var(--ease);}
.dash-group:hover{box-shadow:var(--shadow)}
.dash-group::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg, var(--group-accent), color-mix(in srgb, var(--group-accent) 20%, transparent) 80%, transparent);}
.dash-group::after{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle, color-mix(in srgb, var(--group-accent) 12%, transparent), transparent 70%);pointer-events:none;}
.dash-group[data-accent="indigo"]{--group-accent:#5b5bf6;--group-soft:rgba(91,91,246,.09)}
.dash-group[data-accent="emerald"]{--group-accent:#10b981;--group-soft:rgba(16,185,129,.09)}
.dash-group[data-accent="amber"]{--group-accent:#f59e0b;--group-soft:rgba(245,158,11,.09)}

/* ===== GROUP HEADER ===== */
.group-header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);position:relative;}
.group-header::after{content:'';position:absolute;bottom:-1px;left:0;width:80px;height:2px;background:var(--group-accent);border-radius:2px;box-shadow:0 0 12px var(--group-accent);}
.group-badge{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg, var(--group-accent), color-mix(in srgb, var(--group-accent) 60%, #000));color:#fff;font-weight:800;font-size:15px;box-shadow:0 10px 22px -8px var(--group-accent), inset 0 1px 0 rgba(255,255,255,.25);flex-shrink:0;font-family:'Space Grotesk',sans-serif;}
.group-header-text{flex:1 1 180px;min-width:0;}
.group-title{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;margin:0;letter-spacing:-.03em;}
.group-sub{font-size:12.5px;color:var(--text-dim);margin:2px 0 0;font-weight:500}
.group-tag{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--group-accent);background:var(--group-soft);padding:5px 12px;border-radius:100px;border:1px solid color-mix(in srgb, var(--group-accent) 25%, transparent);white-space:nowrap;}
.group-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto;}

/* ===== COMPACT TABS & FILTER ===== */
.period-tabs{display:inline-flex;gap:4px;padding:5px;background:var(--surface-2);border-radius:16px;border:1px solid var(--border);margin-bottom:16px;}
.period-tabs.compact{padding:3px;margin:0;border-radius:12px;gap:2px;}
.period-tab{padding:8px 16px;border-radius:12px;font-size:12.5px;font-weight:700;color:var(--text-dim);transition:all .22s var(--ease);display:flex;align-items:center;gap:9px;white-space:nowrap;font-family:'Space Grotesk',sans-serif;}
.period-tab:hover{color:var(--text)}
.period-tab.active{background:var(--surface-solid);color:var(--text);box-shadow:var(--shadow-xs);}
.period-tab .dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);transition:all .22s}
.period-tab.active .dot{background:var(--primary);box-shadow:0 0 0 4px var(--primary-tint)}
[data-theme="dark"] .period-tab.active{background:var(--primary-soft);color:var(--primary)}
.period-tabs.compact .period-tab{padding:6px 12px;font-size:11.5px;border-radius:9px;gap:6px;}
.period-tabs.compact .period-tab .dot{width:5px;height:5px;}
.period-tabs.compact .period-tab.active .dot{box-shadow:0 0 0 3px var(--primary-tint)}

.period-filter{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:12px 16px;background:var(--surface-2);border-radius:16px;margin-bottom:16px;border:1px solid var(--border);}
.period-filter.compact{padding:4px 8px;margin:0;gap:8px;border-radius:12px;}
.filter-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);margin-right:2px;}
.period-filter.compact .filter-label{font-size:9px;}
.date-input{padding:8px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface-solid);color:var(--text);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;}
.date-input:hover{border-color:var(--border-strong)}
.date-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-tint)}
.period-filter.compact .date-input{padding:5px 9px;font-size:11px;border-radius:8px;}
select.date-input{padding-right:36px;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235a6480' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 12px center;background-size:14px;-webkit-appearance:none;appearance:none;}
.period-filter.compact select.date-input{padding-right:26px;background-position:right 8px center;background-size:11px;}
.mode-pill{display:inline-flex;padding:4px;background:var(--surface-solid);border:1px solid var(--border);border-radius:13px;gap:3px;}
.mode-pill button{padding:6px 14px;border-radius:10px;font-size:12px;font-weight:700;color:var(--text-dim);transition:all .2s var(--ease);font-family:'Space Grotesk',sans-serif;}
.mode-pill button:hover{color:var(--text)}
.mode-pill button.active{background:linear-gradient(135deg, var(--primary), var(--primary-2));color:#fff;box-shadow:0 4px 12px -3px var(--primary);}
.period-filter.compact .mode-pill{padding:2px;border-radius:9px;gap:2px;}
.period-filter.compact .mode-pill button{padding:4px 9px;font-size:10.5px;border-radius:7px;}

/* ===== BALANCE LAYOUT ===== */
.balance-layout{
  display:grid;
  grid-template-columns:minmax(180px,220px) minmax(240px,1.1fr) minmax(280px,1.3fr);
  gap:12px;align-items:start;margin-bottom:14px;
}
.balance-layout .alloc-mini-grid{margin-top:0;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}
.balance-totals{display:flex;flex-direction:column;gap:8px;}
.balance-total{padding:18px 20px;border-radius:var(--radius-xl);color:#fff;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;min-height:120px;box-shadow:var(--shadow);transition:transform .3s var(--ease);}
.balance-total:hover{transform:translateY(-2px)}
.balance-total::before{content:'';position:absolute;right:-60px;top:-60px;width:200px;height:200px;background:radial-gradient(circle, rgba(255,255,255,.22), transparent 65%);border-radius:50%;}
.balance-total::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg, rgba(255,255,255,.12), transparent 40%);pointer-events:none;}
.balance-total.c1{background:linear-gradient(135deg,#5b5bf6 0%, #4338ca 55%, #1e1b4b 100%);box-shadow:0 20px 44px -16px #5b5bf6, inset 0 1px 0 rgba(255,255,255,.15)}
.balance-total.c2{background:linear-gradient(135deg,#10b981 0%, #059669 55%, #064e3b 100%);box-shadow:0 20px 44px -16px #10b981, inset 0 1px 0 rgba(255,255,255,.15)}
.balance-total.c3{background:linear-gradient(135deg,#f59e0b 0%, #d97706 55%, #7c2d12 100%);box-shadow:0 20px 44px -16px #f59e0b, inset 0 1px 0 rgba(255,255,255,.15)}
.balance-total.compact{padding:10px 14px;min-height:auto;border-radius:16px;}
.balance-total.compact .bt-value{font-size:18px;margin:2px 0 4px;letter-spacing:-.03em;line-height:1.1;}
.balance-total.compact .bt-label{font-size:9.5px;letter-spacing:.1em;}
.balance-total.compact .bt-status{font-size:9px;padding:2px 8px;gap:4px;}
.balance-total.compact .bt-status svg{width:10px;height:10px;}
.bt-label{font-size:10px;opacity:.9;letter-spacing:.12em;font-weight:800;text-transform:uppercase;position:relative;z-index:1;}
.bt-value{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;margin:8px 0 10px;letter-spacing:-.045em;font-variant-numeric:tabular-nums;position:relative;z-index:1;}
.bt-status{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:100px;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);width:fit-content;position:relative;z-index:1;border:1px solid rgba(255,255,255,.18);}
.bt-status.ok{background:rgba(16,185,129,.3);border-color:rgba(16,185,129,.45)}
.bt-status.warn{background:rgba(239,68,68,.32);border-color:rgba(239,68,68,.5)}
.bt-status svg{width:12px;height:12px}
.balance-side{background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:10px;display:flex;flex-direction:column;min-width:0;}
.balance-side-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.balance-grid-compact{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;align-content:start;}
.balance-mini{padding:8px 10px;background:var(--surface-solid);border-radius:12px;border:1px solid transparent;transition:all .25s var(--ease);position:relative;overflow:hidden;}
.balance-mini::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--mini-color,var(--group-accent));box-shadow:0 0 10px var(--mini-color,var(--group-accent));}
.balance-mini:hover{border-color:var(--mini-color,var(--group-accent));transform:translateY(-1px);box-shadow:var(--shadow-xs);}
.bm-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding-left:8px}
.bm-name{font-size:10px;font-weight:800;color:var(--text-dim);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px;}
.bm-value{font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;white-space:nowrap;}
.bm-detail{font-size:9px;color:var(--text-faint);margin-top:2px;padding-left:8px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ===== BIR / FILE / ALLOC ===== */
.bir-grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:12px;margin-bottom:16px}
.bir-card{background:linear-gradient(135deg, var(--group-soft), transparent);border:1px solid var(--group-accent);border-radius:var(--radius-lg);padding:16px 18px;position:relative;overflow:hidden;box-shadow:var(--shadow-xs);}
.bir-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:4px;background:linear-gradient(90deg, var(--group-accent), transparent);}
.bir-card-title{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--group-accent);margin-bottom:12px;display:flex;align-items:center;gap:9px;}
.bir-card-row{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.bir-card-row:last-child{margin-bottom:0}
.bir-card-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);font-weight:700}
.bir-card-value{font-size:12.5px;font-weight:600;color:var(--text);font-family:'JetBrains Mono',monospace}
.file-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-top:12px}
.file-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:8px;transition:all .25s var(--ease);}
.file-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--border-strong)}
.file-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.file-card-name{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:var(--text)}
.file-card-desc{font-size:12px;color:var(--text-dim);line-height:1.55}
.file-status{font-size:10px;font-weight:800;letter-spacing:.08em;padding:4px 10px;border-radius:100px}
.file-status.ok{background:var(--success-soft);color:var(--success)}
.file-status.empty{background:var(--surface);color:var(--text-faint)}
.section-block{display:block}
.section-block.hidden{display:none !important}
.verify-banner{padding:12px 16px;border-radius:16px;margin-top:12px;font-size:12.5px;line-height:1.6;font-weight:500;}
.verify-banner.ok{background:var(--success-soft);border-left:4px solid var(--success);color:var(--success)}
.verify-banner.warn{background:var(--warning-soft);border-left:4px solid var(--warning);color:var(--warning)}
.verify-banner-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.verify-banner-row .verify-banner{flex:1 1 260px;margin-top:0;padding:8px 12px;font-size:11.5px;border-radius:12px;line-height:1.45;}
.verify-banner-row .verify-banner b{font-weight:700;}
.verify-banner-row.mini{margin-top:10px;gap:5px;flex-direction:column;flex-wrap:nowrap;}
.verify-banner-row.mini .verify-banner{flex:1 1 auto;margin-top:0;padding:6px 9px;font-size:10px;border-radius:9px;line-height:1.4;border-left-width:3px;word-break:break-word;}
.alloc-mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:14px;}
.alloc-mini{background:var(--surface-2);border-radius:14px;padding:12px;border-left:4px solid var(--mc,var(--primary));transition:all .25s var(--ease);position:relative;overflow:hidden;}
.alloc-mini:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);background:var(--surface-solid)}
.alloc-mini-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.alloc-mini-value{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px;color:var(--mc,var(--primary));white-space:nowrap;letter-spacing:-.035em;}
.alloc-mini-sub{font-size:10px;color:var(--text-faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sales-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.zoom-control{display:flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:4px;}
.zoom-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:16px;color:var(--text-dim);transition:all .2s;line-height:1;}
.zoom-btn:hover:not(:disabled){background:var(--surface-solid);color:var(--text)}
.zoom-btn:disabled{opacity:.3;cursor:not-allowed}
.zoom-label{font-size:11.5px;font-weight:700;color:var(--text-dim);min-width:46px;text-align:center;font-variant-numeric:tabular-nums;padding:0 6px;font-family:'JetBrains Mono',monospace;}
.sales-table-wrap{overflow:auto;max-height:72vh;border-radius:16px;border:1px solid var(--border);max-width:100%;-webkit-overflow-scrolling:touch;position:relative;background:var(--surface-solid);}
.sales-table{border-collapse:separate;border-spacing:0;min-width:100%;width:max-content}
.sales-table th,.sales-table td{padding:6px 9px;text-align:left;vertical-align:middle;white-space:nowrap;line-height:1.35;border-bottom:1px solid var(--border);border-right:1px solid var(--border);}
.sales-table th:last-child,.sales-table td:last-child{border-right:none}
.sales-table thead th{background:var(--surface-2);font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);position:sticky;top:0;z-index:3;font-size:calc(var(--sf,11px) - 1px);}
.sales-table tbody td{font-size:var(--sf,11px)}
.sales-table tbody tr{transition:background .15s}
.sales-table tbody tr:hover{background:var(--surface-2)}
.sales-table tbody tr.selected{background:var(--primary-soft)}
.sales-table tbody tr.selected:hover{background:var(--primary-soft)}
.sales-table td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:'JetBrains Mono',monospace;font-size:calc(var(--sf,11px) - .5px);}
.sales-table .cell-trunc{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle;color:var(--text-dim);}
.sales-table .cell-trunc.wide{max-width:160px}
.sales-table .sec-start{border-left:2px solid var(--border-strong)}
.sales-table th.sec-start{border-left:2px solid var(--border-strong)}
.sales-table input[type=checkbox]{cursor:pointer;width:15px;height:15px;accent-color:var(--primary);margin:0;display:block;}
.sales-table .row-actions{display:flex;gap:4px;align-items:center}
.sales-table .row-actions .btn{padding:3px 8px;font-size:10px;border-radius:6px;line-height:1.2}
.sales-table .idx{color:var(--text-faint);font-size:10px;text-align:center}
.sales-table .remarks-icon{display:inline-block;color:var(--warning);cursor:help;font-size:12px;}
.sales-table th.frz,.sales-table td.frz{position:sticky;background:var(--surface-solid);z-index:2}
.sales-table thead th.frz{z-index:6;background:var(--surface-2)}
.sales-table tbody tr:hover td.frz{background:var(--surface-2)}
.sales-table tbody tr.selected td.frz{background:var(--primary-soft)}
.sales-table tbody tr.selected:hover td.frz{background:var(--primary-soft)}
.sales-table .frz-last{border-right:2px solid var(--border-strong) !important}
.txn-id-cell{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:var(--text-dim);white-space:nowrap;text-align:center;letter-spacing:-.02em;}
.sales-table tbody tr.refunded-row td{opacity:.55;background:rgba(120,113,108,.05)}
.sales-table tbody tr.refunded-row:hover td{background:rgba(120,113,108,.1)}
.sales-table tbody tr.refunded-row td.num{text-decoration:line-through;text-decoration-color:rgba(225,29,72,.5)}
.sales-table tbody tr.refunded-row td .cell-trunc{text-decoration:line-through;text-decoration-color:rgba(120,113,108,.4)}
.sales-table tbody tr.refunded-row.selected td{background:rgba(91,91,246,.08)}

.cell-edit{display:inline-flex;align-items:center;gap:2px;max-width:100%}
.cell-edit .cell-trunc{max-width:120px}
.cell-edit .cell-trunc.wide{max-width:160px}
.inline-popover{position:fixed;z-index:250;background:var(--surface-solid);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg), 0 0 0 1px rgba(91,91,246,.08);padding:12px 14px;min-width:240px;max-width:320px;animation:popIn .22s var(--ease-bounce);backdrop-filter:blur(20px);}

.inline-popover-title{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);margin-bottom:7px;display:flex;align-items:center;gap:6px;}

.inline-popover input,.inline-popover select,.inline-popover textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-solid);color:var(--text);font-size:14px;font-weight:600;font-family:'JetBrains Mono',monospace;outline:none;transition:all .2s;font-variant-numeric:tabular-nums;box-sizing:border-box;}
.inline-popover input[type="text"],.inline-popover select,.inline-popover textarea{font-family:'Inter',system-ui,sans-serif;font-weight:500;}
.inline-popover textarea{resize:vertical;min-height:60px;line-height:1.4;font-size:12.5px;}
.inline-popover input:focus,.inline-popover select:focus,.inline-popover textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-tint);}
.inline-popover-hint{font-size:10px;color:var(--text-faint);margin-top:6px;line-height:1.4;}
.inline-popover-actions{display:flex;gap:6px;margin-top:9px;justify-content:flex-end;}
.inline-popover-actions button{padding:6px 12px;font-size:11.5px;font-weight:700;border-radius:8px;transition:all .18s var(--ease);font-family:'Space Grotesk',sans-serif;letter-spacing:-.005em;}
.inline-btn-cancel{background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);}
.inline-btn-cancel:hover{background:var(--surface-3);color:var(--text)}
.inline-btn-update{background:linear-gradient(135deg, var(--primary), var(--primary-2));color:#fff;box-shadow:0 4px 12px -3px rgba(91,91,246,.5);}
.inline-btn-update:hover{transform:translateY(-1px);box-shadow:0 8px 18px -6px rgba(91,91,246,.6)}
.bulk-bar{position:sticky;top:0;z-index:15;background:linear-gradient(135deg, var(--primary-soft), var(--surface));border:1px solid var(--primary);border-radius:14px;padding:8px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow-sm);animation:slideUp .3s var(--ease);backdrop-filter:blur(20px);transition:all .25s var(--ease);}
.bulk-bar.empty{background:var(--surface-2);border-color:var(--border);box-shadow:var(--shadow-xs);}
.bulk-bar.empty .count{color:var(--text-faint);font-weight:700}
.bulk-bar.empty .btn{opacity:.4;pointer-events:none;filter:grayscale(.3)}
.bulk-bar.empty .bulk-total-value{color:var(--text-faint);opacity:.6}
.bulk-bar.empty .close-bulk{display:none}
.bulk-bar-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.bulk-bar .count{font-weight:800;color:var(--primary);font-size:11.5px;margin-right:6px;font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em;min-width:78px}
.bulk-bar .btn{font-size:10.5px;padding:5px 10px;border-radius:8px;font-weight:700}
.bulk-bar .spacer{flex:1}
.bulk-bar .close-bulk{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--primary);font-weight:700;font-size:12px;transition:all .15s;}
.bulk-bar .close-bulk:hover{background:rgba(91,91,246,.15)}
.bulk-totals-strip{display:flex;gap:6px;flex-wrap:wrap;padding-top:6px;border-top:1px dashed var(--border-strong);}
.bulk-total{display:flex;flex-direction:column;gap:1px;padding:5px 10px;background:var(--surface-solid);border:1px solid var(--border);border-radius:9px;min-width:88px;transition:all .2s var(--ease);}
.bulk-total:hover{border-color:var(--border-strong);transform:translateY(-1px);box-shadow:var(--shadow-xs)}
.bulk-total-label{font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);white-space:nowrap;}
.bulk-total-value{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:11.5px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap;}
.bulk-total-value.credit{color:var(--success)}
.bulk-total-value.fees{color:var(--warning)}
.bulk-total-value.wht{color:var(--warning)}
.bulk-total-value.discount{color:var(--warning)}
.bulk-total-value.debit{color:var(--primary)}
.bulk-total-value.profit{color:var(--purple)}
.bulk-total-value.pending{color:var(--danger)}
.hscroll-hint{font-size:11.5px;color:var(--text-faint);margin-top:10px;display:flex;align-items:center;gap:8px;}
.sort-control{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:5px 11px;}
.sort-control select{border:none;background:transparent;font-size:12px;font-weight:700;color:var(--text);cursor:pointer;outline:none;padding:6px;font-family:'Space Grotesk',sans-serif;}
.sort-control .label{font-size:10.5px;font-weight:800;text-transform:uppercase;color:var(--text-faint);letter-spacing:.08em;}
.item-table-wrap{overflow:auto;max-height:72vh;border-radius:16px;border:1px solid var(--border);max-width:100%;background:var(--surface-solid);}
.item-table{width:100%;border-collapse:collapse}
.item-table th,.item-table td{padding:10px 12px;text-align:left;vertical-align:middle;white-space:nowrap;border-bottom:1px solid var(--border);font-size:12px;}
.item-table thead th{background:var(--surface-2);font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);font-size:10.5px;position:sticky;top:0;z-index:2;}
.item-table tbody tr{transition:background .15s}
.item-table tbody tr:hover{background:var(--surface-2)}
.item-table tbody tr.selected{background:var(--primary-soft)}
.item-table td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:'JetBrains Mono',monospace}
.item-table .cell-trunc{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}
.item-table input[type=checkbox]{cursor:pointer;width:15px;height:15px;accent-color:var(--primary);margin:0}
.item-table .row-actions{display:flex;gap:4px}
.item-table .row-actions .btn{padding:3px 8px;font-size:10px;border-radius:6px;line-height:1.2}
.split-widget{background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:16px;}
.split-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;min-height:46px;align-items:center;padding:2px;}
.split-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:100px;background:var(--surface-solid);border:1px solid var(--border);font-size:12px;font-weight:700;transition:all .25s var(--ease);box-shadow:var(--shadow-xs);animation:chipPop .3s var(--ease-bounce);}
.split-chip:hover{border-color:var(--primary);transform:translateY(-1px);box-shadow:var(--shadow)}
.split-chip .mop{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);}
.split-chip .amt{font-family:'JetBrains Mono',monospace;font-weight:800;color:var(--primary);font-size:12.5px;}
.split-chip .x{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--text-faint);font-size:10px;line-height:1;transition:all .2s;font-weight:800;}
.split-chip .x:hover{background:var(--danger-soft);color:var(--danger);transform:rotate(90deg)}
.split-empty{color:var(--text-faint);font-size:12px;padding:10px 6px;font-style:italic;display:flex;align-items:center;gap:8px;}
.split-add{display:grid;grid-template-columns:1fr 140px auto;gap:8px;align-items:stretch;}
.split-add select,.split-add input{padding:9px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface-solid);color:var(--text);font-size:12.5px;width:100%;transition:all .18s;font-weight:600;}
.split-add select:hover,.split-add input:hover{border-color:var(--border-strong)}
.split-add select:focus,.split-add input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-tint);}
.split-add .btn{padding:9px 16px}
.split-status{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:13px;font-size:12px;font-weight:700;background:var(--surface-solid);border:1px solid var(--border);color:var(--text-dim);transition:all .25s var(--ease);}
.split-status.ok{background:var(--success-soft);color:var(--success);border-color:transparent}
.split-status.warn{background:var(--warning-soft);color:var(--warning);border-color:transparent}
.split-status.over{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.split-status .val{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:12.5px}
.split-status .lead{display:flex;align-items:center;gap:8px}
@keyframes chipPop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.sale-landscape{display:grid;grid-template-columns:1fr 280px;gap:0;height:100%;min-height:0;}
.sale-landscape-form{padding:10px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:0;border-right:1px solid var(--border);}
.sale-landscape-preview{padding:10px 12px;overflow-y:auto;background:linear-gradient(180deg, var(--surface-2) 0%, var(--surface-solid) 100%);display:flex;flex-direction:column;gap:8px;min-height:0;}
.lp-title{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--text-faint);display:flex;align-items:center;gap:10px;}
.lp-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg, var(--border), transparent)}
.lp-hero{padding:14px 16px;border-radius:16px;background:linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);color:#fff;box-shadow:0 12px 28px -12px rgba(91,91,246,.5);position:relative;overflow:hidden;}
.lp-hero::before{content:'';position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,.2), transparent 70%);}
.lp-hero-label{font-size:10px;opacity:.9;letter-spacing:.12em;font-weight:800;text-transform:uppercase;position:relative;z-index:1}
.lp-hero-value{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;letter-spacing:-.045em;margin-top:4px;font-variant-numeric:tabular-nums;position:relative;z-index:1;line-height:1.05;}
.lp-hero-sub{font-size:11px;opacity:.85;margin-top:4px;position:relative;z-index:1;font-weight:600}
.lp-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:12px;background:var(--surface-solid);border:1px solid var(--border);transition:all .2s;}
.lp-row:hover{border-color:var(--border-strong)}
.lp-row-label{font-size:11px;font-weight:700;color:var(--text-dim);display:flex;align-items:center;gap:8px;}
.lp-row-label::before{content:'';width:8px;height:8px;border-radius:3px;background:var(--lc, var(--primary));}
.lp-row-value{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);}
.lp-row-value.neg{color:var(--danger)}
.lp-row-value.pos{color:var(--success)}
.lp-divider{height:1px;background:linear-gradient(90deg, transparent, var(--border), transparent);margin:2px 0}
.lp-hint{font-size:10.5px;color:var(--text-faint);padding:10px 12px;background:var(--surface-2);border-radius:12px;line-height:1.55;border-left:3px solid var(--info);}
.sale-block{padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;}
.sale-block-title{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);margin-bottom:8px;display:flex;align-items:center;gap:9px;}
.sale-block-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg, var(--border), transparent)}
.sale-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sale-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.autofill-hint{font-size:10px;color:var(--text-faint);margin-top:3px;line-height:1.4;transition:color .2s;}
.autofill-hint.active{color:var(--success);font-weight:600}
.folder-status{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;background:var(--surface-2);border:1px solid var(--border);margin-bottom:16px;}
.folder-status.ok{background:var(--success-soft);border-color:var(--success)}
.folder-status.warn{background:var(--warning-soft);border-color:var(--warning)}
.folder-status.err{background:var(--danger-soft);border-color:var(--danger)}
.folder-icon{font-size:26px;flex-shrink:0}
.folder-info{flex:1;min-width:0}
.folder-title{font-weight:700;font-size:13.5px;font-family:'Space Grotesk',sans-serif}
.folder-desc{font-size:12px;color:var(--text-dim);margin-top:2px;word-break:break-all}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:16px;}
.settings-card{border-radius:var(--radius-xl);background:var(--surface);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--border);padding:20px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:all .3s var(--ease);}
.settings-card:hover{box-shadow:var(--shadow)}
.settings-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg, var(--card-accent,var(--primary)), transparent 80%);opacity:.85;}
.settings-card[data-accent="indigo"]{--card-accent:#5b5bf6}
.settings-card[data-accent="emerald"]{--card-accent:#10b981}
.settings-card[data-accent="amber"]{--card-accent:#f59e0b}
.settings-card[data-accent="rose"]{--card-accent:#e11d48}
.settings-card[data-accent="purple"]{--card-accent:#9333ea}
.settings-card[data-accent="info"]{--card-accent:#0284c7}
.settings-card-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border);}
.settings-card-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg, var(--card-accent,var(--primary)), color-mix(in srgb, var(--card-accent,var(--primary)) 60%, #000));color:#fff;box-shadow:0 8px 20px -8px var(--card-accent,var(--primary));flex-shrink:0;font-size:18px;}
.settings-card-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;letter-spacing:-.02em;margin:0;}
.settings-card-sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
.logo-uploader{display:flex;gap:18px;align-items:center;padding:16px;border-radius:16px;background:var(--surface-2);border:1px dashed var(--border-strong);margin-bottom:16px;}
.logo-preview{width:70px;height:70px;border-radius:18px;display:grid;place-items:center;background:conic-gradient(from 200deg at 50% 50%, #5b5bf6, #a855f7, #ec4899, #f59e0b, #5b5bf6);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;overflow:hidden;flex-shrink:0;box-shadow:0 12px 28px -12px rgba(91,91,246,.5), inset 0 1px 0 rgba(255,255,255,.35);position:relative;}
.logo-preview img{width:100%;height:100%;object-fit:cover;display:block}
.logo-placeholder{display:grid;place-items:center;width:100%;height:100%;}
.logo-upload-info{flex:1;min-width:0}
.logo-upload-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.col-toggle-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;padding:10px;background:var(--surface-2);border-radius:14px;border:1px solid var(--border);}
.col-toggle{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:10px;background:var(--surface-solid);border:1px solid var(--border);cursor:pointer;font-size:11.5px;font-weight:600;color:var(--text-dim);transition:all .18s var(--ease);user-select:none;}
.col-toggle:hover{border-color:var(--primary);color:var(--text);transform:translateY(-1px)}
.col-toggle input{display:none}
.col-toggle .check{width:14px;height:14px;border-radius:5px;border:2px solid var(--border-strong);display:grid;place-items:center;flex-shrink:0;transition:all .2s;background:var(--surface-solid);}
.col-toggle input:checked ~ .check{background:var(--primary);border-color:var(--primary);}
.col-toggle input:checked ~ .check::after{content:'✓';color:#fff;font-size:10px;font-weight:900;line-height:1;}
.col-toggle input:checked ~ span{color:var(--text);font-weight:700}
.settings-actions{display:flex;gap:12px;flex-wrap:wrap;padding:16px 20px;background:var(--surface);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow);position:sticky;bottom:20px;z-index:5;}
.settings-actions .status{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-dim);font-weight:600;}
.settings-actions .status .dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px var(--success-soft);}

/* ====== SUBNAV ====== */
.subnav{display:inline-flex;gap:4px;padding:6px;background:var(--surface-2);border-radius:16px;border:1px solid var(--border);margin-bottom:18px;box-shadow:var(--shadow-xs);}
.subnav button{padding:8px 18px;border-radius:12px;font-size:12.5px;font-weight:700;color:var(--text-dim);transition:all .22s var(--ease);display:flex;align-items:center;gap:9px;white-space:nowrap;font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em;}
.subnav button:hover{color:var(--text)}
.subnav button.active{background:linear-gradient(135deg, var(--primary), var(--primary-2));color:#fff;box-shadow:0 6px 16px -6px var(--primary), inset 0 1px 0 rgba(255,255,255,.18);}

/* ====== ESTIMATOR LAYOUT ====== */
.est-grid{display:grid;grid-template-columns:280px 340px 320px minmax(0,1fr);gap:14px;align-items:stretch;height:calc(100vh - 220px);min-height:620px;}
@media (max-width:1500px){.est-grid{grid-template-columns:260px 300px 300px minmax(0,1fr);}}
@media (max-width:1200px){.est-grid{grid-template-columns:1fr 1fr;height:auto;min-height:0;}.est-panel{max-height:70vh;}.est-panel.est-panel-preview{max-height:80vh;}}
@media (max-width:820px){.est-grid{grid-template-columns:1fr;}}
.est-panel{background:var(--surface);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-xs);overflow-y:auto;overflow-x:hidden;max-height:100%;min-height:0;scrollbar-gutter:stable;}
.est-panel.est-panel-preview{overflow:hidden;display:flex;flex-direction:column;}
.est-panel h3{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);margin:0 0 10px;display:flex;align-items:center;gap:8px;}
.est-panel h3::after{content:'';flex:1;height:1px;background:linear-gradient(90deg, var(--border), transparent);}
.est-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.est-field{display:flex;flex-direction:column;gap:4px}
.est-field label{font-size:10.5px;font-weight:700;color:var(--text-dim);letter-spacing:.01em}
.est-field input,.est-field select{padding:7px 9px;border:1px solid var(--border);border-radius:10px;background:var(--surface-solid);color:var(--text);font-size:12px;font-weight:500;transition:all .2s var(--ease);width:100%;}
.est-field input:focus,.est-field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
.est-result{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--surface-solid);margin:3px 0;border-radius:10px;border:1px solid var(--border);font-size:12px;gap:8px;}
.est-result .lbl{color:var(--text-dim);font-weight:600}
.est-result .val{font-weight:700;color:var(--primary);font-family:'JetBrains Mono',monospace;white-space:nowrap}
.est-result.total{background:linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);border:none;color:#fff;box-shadow:var(--glow);}
.est-result.total .lbl,.est-result.total .val{color:#fff}
.est-preview-box{background:var(--surface-solid);padding:18px;border-radius:14px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex:1;min-height:0;overflow:hidden;position:relative;background-image:radial-gradient(at 80% 20%, rgba(91,91,246,.08) 0px, transparent 50%),radial-gradient(at 20% 80%, rgba(168,85,247,.06) 0px, transparent 50%);}
.est-preview-box.transparent{background-image:linear-gradient(45deg, rgba(0,0,0,.05) 25%, transparent 25%),linear-gradient(-45deg, rgba(0,0,0,.05) 25%, transparent 25%),linear-gradient(45deg, transparent 75%, rgba(0,0,0,.05) 75%),linear-gradient(-45deg, transparent 75%, rgba(0,0,0,.05) 75%);background-size:20px 20px;background-position:0 0, 0 10px, 10px -10px, -10px 0;background-color:var(--surface-solid);}
.est-page{background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.35), 0 0 60px rgba(91,91,246,.22);position:relative;border:2px solid var(--primary);border-radius:4px;flex-shrink:0;}
.est-page.transparent{background:repeating-conic-gradient(#d8d8d8 0% 25%, #ffffff 0% 50%) 0 0 / 16px 16px;}
.est-sticker{position:absolute;background:linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);border:1.5px solid rgba(255,255,255,.5);border-radius:2px;box-shadow:0 1px 4px rgba(91,91,246,.35);background-size:cover;background-position:center;}
.est-sticker.circle{border-radius:50%;}
.est-sticker.custom{border-radius:30% 70% 50% 50% / 40% 40% 60% 60%;background:linear-gradient(135deg, var(--purple) 0%, #ec4899 100%);}
.est-sticker.image-shape{border-color:var(--success);}
.est-img-thumb{width:42px;height:42px;object-fit:cover;border-radius:8px;border:2px solid var(--primary);display:none;flex-shrink:0;box-shadow:var(--glow);}
.est-margin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.est-margin-grid .est-field label{font-size:10px}
.est-check-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.est-check-row label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--text);font-weight:600;margin:0}
.est-check-row input[type=checkbox]{width:15px;height:15px;accent-color:var(--primary);cursor:pointer;flex-shrink:0}

/* ====== QUOTE MODAL ====== */
.brand-panel{background:linear-gradient(135deg, rgba(91,91,246,.08), rgba(147,51,234,.05));border:1px solid rgba(91,91,246,.3);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;}
.brand-panel.all-loaded{border-color:rgba(16,185,129,.3);background:linear-gradient(135deg, rgba(16,185,129,.06), rgba(16,185,129,.02));}
.brand-panel-title{font-size:12px;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand-panel-title .ok-count{color:var(--success)}
.brand-panel-title .miss-count{color:var(--danger)}
.brand-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.brand-slot{background:rgba(0,0,0,.08);border:1px dashed var(--border-strong);border-radius:10px;padding:8px;display:flex;align-items:center;gap:8px;transition:all .2s var(--ease);position:relative;}
[data-theme="dark"] .brand-slot{background:rgba(0,0,0,.25)}
.brand-slot.loaded{border-style:solid;border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.05);}
.brand-slot-preview{width:42px;height:42px;flex-shrink:0;object-fit:contain;border-radius:6px;background:#fff;border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:18px;}
.brand-slot-info{flex:1;min-width:0;}
.brand-slot-name{font-size:11px;font-weight:700;color:var(--text);margin-bottom:2px;}
.brand-slot-status{font-size:10px;color:var(--text-faint);}
.brand-slot-status.ok{color:var(--success)}
.brand-slot-status.miss{color:var(--danger)}
.brand-slot input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.item-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;transition:all .2s var(--ease);}
.item-card:hover{border-color:var(--border-strong)}
.item-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
.item-card-title{font-size:11px;font-weight:700;color:var(--primary);letter-spacing:.05em;text-transform:uppercase;font-family:'Space Grotesk',sans-serif;}
.lamination-row{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--text);padding:6px 10px;background:rgba(0,0,0,.06);border-radius:8px;}
[data-theme="dark"] .lamination-row{background:rgba(0,0,0,.2)}
.lamination-row label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:1em;color:var(--text);font-weight:600;margin:0;}
.lamination-row input[type=radio]{width:14px;height:14px;accent-color:var(--primary);cursor:pointer;}
.item-total{display:flex;justify-content:space-between;padding-top:6px;border-top:1px dashed var(--border-strong);font-size:12.5px;}
.item-total .lbl{color:var(--text-dim);font-weight:600}
.item-total .val{color:var(--success);font-weight:700;font-family:'JetBrains Mono',monospace;}
.design-upload-preview{margin-top:6px;padding:8px;background:#fff;border-radius:10px;border:1px solid var(--border-strong);text-align:center;min-height:80px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;}
.design-upload-preview img{max-width:100%;max-height:120px;object-fit:contain;display:block;}
.design-upload-preview .placeholder{color:#999;font-size:11px;}

/* Quotation preview overlay */
.quote-preview-overlay{position:fixed;inset:0;background:rgba(5,7,15,.78);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);z-index:300;display:flex;flex-direction:column;padding:18px;animation:fadeIn .25s var(--ease);}
.quote-preview-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:#fff;flex-shrink:0;gap:12px;flex-wrap:wrap;}
.quote-preview-title{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px;}
.quote-preview-actions{display:flex;gap:8px;flex-wrap:wrap;}
.quote-preview-scroll{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:10px 0;min-height:0;}
.quote-preview-frame{position:relative;flex-shrink:0;background:#fff;box-shadow:0 24px 64px rgba(0,0,0,.55);overflow:hidden;}
.quote-preview-scaler{position:absolute;top:0;left:0;background:#fff;}

/* Transfer modal / badges */
.transfer-arrow{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.transfer-chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:100px;background:var(--surface-2);color:var(--text);font-size:11px;font-weight:700;border:1px solid var(--border)}

/* ====== MOBILE ====== */
@media (max-width:960px){
  .menu-btn{display:flex;}
  .sidebar{top:0;left:0;bottom:0;border-radius:0;width:var(--rail-expanded);transform:translateX(-100%);box-shadow:var(--shadow-lg);}
  .sidebar.open{transform:translateX(0)}
  .sidebar .brand-text,.sidebar .nav-label,.sidebar .theme-label{opacity:1;transform:translateX(0)}
  .sidebar .nav-item.active::after{opacity:1}
  .main{margin-left:0;padding:16px 14px 60px}
  .topbar{padding-left:0; margin-bottom:16px;}
  .page-title{font-size:24px}
  .kpi-grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .kpi-value{font-size:20px}
  .dash-group{padding:14px}
  .balance-layout{grid-template-columns:1fr;}
  .period-tabs{overflow-x:auto;max-width:100%}
  .period-filter{flex-direction:column;align-items:stretch}
  .modal{max-width:100%}
  .modal.modal-lg{max-width:100%}
  .sale-landscape{grid-template-columns:1fr}
  .sale-landscape-preview{border-top:1px solid var(--border);border-right:none;max-height:300px}
  .sale-landscape-form{border-right:none}
  .sale-grid-2,.sale-grid-3{grid-template-columns:1fr}
  .settings-grid{grid-template-columns:1fr}
  .bulk-totals-strip{overflow-x:auto;flex-wrap:nowrap}
  .brand-grid{grid-template-columns:1fr;}
  .recent-sales-table{min-width:640px;}
  .recent-sales-table th, .recent-sales-table td{white-space:nowrap;word-break:normal;padding:6px 8px;font-size:11.5px;}
  .sales-table th, .sales-table td{padding:5px 7px;}
  .verify-banner-row .verify-banner{flex:1 1 100%;}
}
@media (max-width:768px){
  .group-header{flex-direction:column;align-items:flex-start;}
  .group-controls{margin-left:0;width:100%;}
  .period-tabs.compact{max-width:100%;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;}
  .period-tabs.compact::-webkit-scrollbar{display:none;}
  .period-tabs.compact .period-tab{flex-shrink:0;}
  .period-filter.compact{width:100%;}
}
@media (max-width:600px){
  .split-add{grid-template-columns:1fr 1fr;gap:8px}
  .split-add .btn{grid-column:1/-1}
  .main{padding:12px}
  .logo-uploader{flex-direction:column;text-align:center}
  .balance-total.compact .bt-value{font-size:16px;}
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes modalIn{from{opacity:0;transform:translateY(32px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:translateX(0)}}
@keyframes growUp{from{height:0 !important;opacity:0}}
.fade-in{animation:fadeIn .25s var(--ease)}
code{background:var(--surface-2);padding:3px 8px;border-radius:6px;font-size:12px;font-family:'JetBrains Mono',monospace;border:1px solid var(--border);font-weight:600;}

<body>

  <aside class="sidebar" id="sidebar">

      <div class="brand-text">

      <button class="theme-toggle" onclick="toggleTheme()">
        <svg class="nav-icon" id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span class="theme-label" id="themeLabel">Dark Mode</span>
      </button>
