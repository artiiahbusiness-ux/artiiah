<input type="file" id="dexieImportInput" accept=".json" style="display:none" onchange="handleDexieImport(event)">

<script>
/* ============================================================
   DEFAULTS & CONSTANTS
============================================================ */
const DB_KEY = 'artiiah_db_v10';
const FS_SUPPORTED = typeof window !== 'undefined' && 'showDirectoryPicker' in window;

const DEXIE_DB_NAME = 'ArtiiahDexieDB';
const DEXIE_VERSION = 1;
const DEXIE_MAX_BACKUPS = 30;
const DEXIE_BACKUP_MIN_GAP_MS = 30000;
let dexieDB = null;

const DEFAULT_COLUMNS = {
  periodAnalysis: { particulars:true, pending:true, expense:true, abono:true, credit:true, fees:true, wht:true, discount:true, debitCash:true, material:true, benta:true, ink:true, elec:true, profit:true, saTaas:true, bentaBaba:true },
  recentSales: { customer:true, source:true, particulars:true, mop:true, credit:true, debit:true, profit:true, status:true }
};
const DEFAULT_SETTINGS = {
  business: { name:'Artiiah', subtitle:'Printing & Crafts', currency:'₱', logo:null },
  rates: { bentaSaBabaProfit:0.35, bentaSaBabaOwner:0.65, inkPercent:0.05, electricityPercent:0.05 },
  labels: { saTaas:'Sa Taas', bentaBaba:'Benta Sa Baba', ink:'Ink', electricity:'Electricity' },
  mopList: ['Cash','Gcash','Maribank','Shopee Balance','Lazada','TikTok','BPI','BDO','Metrobank','Unionbank','Landbank','Paymaya','Coins.ph'],
  sources: ['Artiiah Printing & Crafts','Marketplace (MJ)','Profile (MJ)','Benta Sa Baba','Shopee','Expenses!','Transfer'],
  expenseCategories: ['Materials','Materials (Baba)','Ink','Electricity','Profit','Salary','Other'],
  columns: structuredClone(DEFAULT_COLUMNS)
};
const SALE_FIELDS = ['id','txnId','date','customerName','source','particulars','serviceInvoiceNo','mop','account','pending','credit','fees','withholding','discount','expense','expensesLessTo','abonoBy','materialName','additionalCost','width','height','damageWidth','damageHeight','amountPaid','paymentStatus','remarks','payments','cancelled','cancelledAt','cancelReason'];
const TRANSFER_FIELDS = ['id','txnId','date','fromMOP','toMOP','amount','remarks'];
const DATA_FILES = { 'settings.json':'settings', 'materials.json':'materials', 'pricing.json':'pricing', 'dailyrecord.json':'daily', 'expensesrecord.json':'expenses', 'transfersrecord.json':'transfers', 'monthlyrecord.json':'monthly', 'annualrecord.json':'annual' };
const COLUMN_LABELS = {
  pa: { particulars:'Particulars', pending:'Pending', expense:'Expense', abono:'Abono', credit:'Credit', fees:'Fees', wht:'WHT', discount:'Discount', debitCash:'Debit Cash', material:'Materials', benta:'Less Benta 35%', ink:'Less Ink 5%', elec:'Less Elec 5%', profit:'Profit', saTaas:'Sa Taas', bentaBaba:'Benta Baba' },
  rs: { customer:'Customer', source:'Source', particulars:'Particulars', mop:'MOP', credit:'Credit', debit:'Debit', profit:'Profit', status:'Status' }
};

/* ============================================================
   UTILITIES
============================================================ */
function uid(){ return 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function peso(n){ const v=Number(n)||0; return '₱'+v.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pesoShort(n){ const v=Number(n)||0; const a=Math.abs(v); if(a>=1e6) return '₱'+(v/1e6).toFixed(1)+'M'; if(a>=1e3) return '₱'+(v/1e3).toFixed(1)+'k'; return '₱'+v.toFixed(0); }
function esc(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'}); }
function fmtMonth(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('en-PH',{month:'short'}); }
function fmtDay(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return d; return dt.getDate(); }
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthLabel(ym){ const [y,m]=ym.split('-'); return MONTHS[+m-1]+' '+y; }
function isTransfer(s){ return s.source==='Transfer' || (s.particulars && String(s.particulars).toLowerCase().includes('transfer')); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr,days){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function deepMerge(a,b){ const out={...a}; for(const k in b){ if(b[k] && typeof b[k]==='object' && !Array.isArray(b[k]) && a[k] && typeof a[k]==='object' && !Array.isArray(a[k])){ out[k]=deepMerge(a[k],b[k]); } else { out[k]=b[k]; } } return out; }
function toggleSidebar(){ const sb = document.getElementById('sidebar'); if(window.innerWidth <= 960){ sb.classList.toggle('open'); } else { sb.classList.toggle('pinned'); } }

/* ============================================================
   TXN ID UTILITIES
============================================================ */
const TXN_TYPE_LETTERS = { sales:'S', expenses:'E', transfers:'T', materials:'M', pricing:'P' };
function getBizPrefix(){
  const name = (db.settings?.business?.name || 'Artiiah').trim();
  const p = name.slice(0,2).toUpperCase();
  return p || 'AR';
}
function nextTxnId(type){
  const prefix = getBizPrefix();
  const tp = TXN_TYPE_LETTERS[type] || 'X';
  const list = db[type] || [];
  let maxNum = 0;
  list.forEach(item => {
    if(item && item.txnId){
      const m = String(item.txnId).match(/(\d+)\s*$/);
      if(m) maxNum = Math.max(maxNum, parseInt(m[1],10));
    }
  });
  return `${prefix}-${tp}${String(maxNum+1).padStart(4,'0')}`;
}
function ensureTxnIds(){
  const prefix = getBizPrefix();
  let changed = false;
  Object.keys(TXN_TYPE_LETTERS).forEach(type => {
    const list = db[type];
    if(!Array.isArray(list)) return;
    let maxNum = 0;
    list.forEach(item => {
      if(item && item.txnId){
        const m = String(item.txnId).match(/(\d+)\s*$/);
        if(m) maxNum = Math.max(maxNum, parseInt(m[1],10));
      }
    });
    list.forEach(item => {
      if(item && !item.txnId){
        maxNum++;
        item.txnId = `${prefix}-${TXN_TYPE_LETTERS[type]}${String(maxNum).padStart(4,'0')}`;
        changed = true;
      }
    });
  });
  return changed;
}
function afterLoad(){
  if(ensureTxnIds()){
    try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){}
    saveToDexie();
  }
}

/* ============================================================
   DB LIFECYCLE
============================================================ */
function emptyDB(){ return { settings:structuredClone(DEFAULT_SETTINGS), materials:[], pricing:[], sales:[], expenses:[], transfers:[], monthly:[], annual:[], _meta:{ loadedFrom:'empty', loadedAt:null } }; }
function normalizeDB(d){ const out = emptyDB(); if(!d || typeof d!=='object') return out;
  out.settings = deepMerge(structuredClone(DEFAULT_SETTINGS), d.settings || {});
  if(!out.settings.columns) out.settings.columns = structuredClone(DEFAULT_COLUMNS);
  else { out.settings.columns.periodAnalysis = Object.assign({}, DEFAULT_COLUMNS.periodAnalysis, out.settings.columns.periodAnalysis||{}); out.settings.columns.recentSales = Object.assign({}, DEFAULT_COLUMNS.recentSales, out.settings.columns.recentSales||{}); }
  out.materials = normalizeMaterials(d.materials || []);
  out.pricing = normalizePricing(d.pricing || []);
  out.sales = normalizeSales(d.sales || []);
  out.expenses = normalizeExpenses(d.expenses || []);
  out.transfers = normalizeTransfers(d.transfers || []);
  out.monthly = Array.isArray(d.monthly) ? d.monthly : (d.monthly?.periods || []);
  out.annual = Array.isArray(d.annual) ? d.annual : (d.annual?.periods || []);
  out._meta = d._meta || { loadedFrom:'cache', loadedAt:new Date().toISOString() };
  return out;
}
function normalizeMaterials(arr){ return arr.map(m=>({ id:m.id||uid(), txnId:m.txnId||'', name:m.name||'', ft:+m.ft||0, sizeQty:m.sizeQty||'', price:+m.price||0, remarks:m.remarks||'' })); }
function normalizePricing(arr){ return arr.map(p=>({ id:p.id||uid(), txnId:p.txnId||'', item:p.item||'', price:+p.price||0, remarks:p.remarks||'' })); }
function normalizeExpenses(arr){ return arr.map(e=>({ id:e.id||uid(), txnId:e.txnId||'', date:e.date||'', particulars:e.particulars||'', category:e.category||'', mop:e.mop||'', amount:+e.amount||0, remarks:e.remarks||'' })); }
function normalizeTransfers(arr){
  let data = arr;
  if(data && !Array.isArray(data) && Array.isArray(data.records)){ const fields = data.fields || TRANSFER_FIELDS; data = data.records.map(r=>{ if(Array.isArray(r)){ const o={}; fields.forEach((f,i)=>o[f]=r[i]); return o; } return r; }); }
  return (data||[]).map(t=>({
    id: t.id||uid(), txnId: t.txnId||'', date: t.date||'', fromMOP: t.fromMOP||'', toMOP: t.toMOP||'',
    amount: +t.amount||0, remarks: t.remarks||''
  }));
}
function parsePayments(raw){
  let arr = [];
  if(Array.isArray(raw)) arr = raw;
  else if(typeof raw === 'string' && raw.trim()){ try{ const parsed = JSON.parse(raw); if(Array.isArray(parsed)) arr = parsed; }catch(e){ arr = []; } }
  return arr.map(p=>({ mop: (p.mop||'').toString().trim(), amount: +p.amount || 0 })).filter(p=> p.mop && p.amount > 0);
}
function normalizeSales(data){
  let arr=[];
  if(Array.isArray(data)) arr=data;
  else if(data && Array.isArray(data.records)){ const fields = data.fields || SALE_FIELDS; arr = data.records.map(r=>{ if(Array.isArray(r)){ const o={}; fields.forEach((f,i)=>o[f]=r[i]); return o; } return r; }); }
  return arr.map(s=>({
    id: s.id||uid(), txnId: s.txnId||'', date:s.date||'', customerName:s.customerName||'', source:s.source||'',
    particulars:s.particulars||'', serviceInvoiceNo:s.serviceInvoiceNo||'', mop:s.mop||'', account:s.account||'',

const CLOUD_CONFIG_KEY = 'artiiah_cloud_v1';
let cloudConfig = { enabled: false, apiBase: '/api', apiKey: '', lastPushAt: null, lastPullAt: null, autoPush: false };
let cloudPushTimer = null;

function loadCloudConfig(){
  try {
    const raw = localStorage.getItem(CLOUD_CONFIG_KEY);
    if (raw) cloudConfig = { ...cloudConfig, ...JSON.parse(raw) };
  } catch(e){}
}
function saveCloudConfig(){
  try { localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cloudConfig)); } catch(e){}
}
async function cloudFetch(path, opts = {}){
  const base = (cloudConfig.apiBase || '/api').replace(/\/+$/,'');
  const url = base + path;
  const headers = { 'Content-Type': 'application/json', ...(opts.headers||{}) };
  if (cloudConfig.apiKey) headers['X-Artiiah-Key'] = cloudConfig.apiKey;
  const res = await fetch(url, { ...opts, headers });
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try { const j = await res.json(); msg = j.error || msg; } catch(e){}
    throw new Error(msg);
  }
  return res.json();
}
async function cloudPush(silent = false){
  if (cloudBusy) return;
  cloudBusy = true;
  try {
    const payload = JSON.parse(JSON.stringify(db));
    payload._meta = { ...(payload._meta||{}), lastModified: new Date().toISOString() };
    await cloudFetch('/data', { method: 'POST', body: JSON.stringify(payload) });
    cloudConfig.lastPushAt = new Date().toISOString();
    saveCloudConfig();
    if (!silent) toast('☁️ Pushed to Cloudflare KV!', 'success');
    if (currentTab === 'data') render();
  } catch(e) {
    if (!silent) toast('☁️ Push failed: ' + e.message, 'error');
  } finally { cloudBusy = false; }
}
async function cloudPull(silent = false){
  if (cloudBusy) return;
  cloudBusy = true;
  try {
    const res = await cloudFetch('/data', { method: 'GET' });
    if (!res || !res.data) {
      if (!silent) toast('☁️ Walang cloud data pa — push muna.', 'info');
      return;
    }
    if (!silent && !confirm('Pull cloud data? Papalitan nito ang local data mo.')) { cloudBusy = false; return; }
    db = normalizeDB(res.data);
    db._meta = { ...(db._meta||{}), loadedFrom:'cloud', loadedAt: new Date().toISOString() };
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    saveToDexie();
    cloudConfig.lastPullAt = new Date().toISOString();
    saveCloudConfig();
    afterLoad();
    render();

  } catch(e) {
    if (!silent) toast('☁️ Pull failed: ' + e.message, 'error');
  } finally { cloudBusy = false; }
}

function initDexie(){

  if(dexieDB) return dexieDB;
  try { dexieDB = new Dexie(DEXIE_DB_NAME); dexieDB.version(DEXIE_VERSION).stores({ saved:'id', backups:'++id, timestamp' }); return dexieDB; } catch(e){ return null; }

async function saveToDexie(){
  if(!dexieDB) return;
  try {
    const json = JSON.stringify(db); const now = Date.now();
    const meta = db._meta?.loadedFrom || 'app';
    await dexieDB.saved.put({ id:'current', timestamp:now, data:json });
    const last = await dexieDB.backups.orderBy('timestamp').last();
    if(!last || (now - last.timestamp) >= DEXIE_BACKUP_MIN_GAP_MS){
      await dexieDB.backups.add({ timestamp:now, data:json, loadedFrom:meta, size:json.length });
      const count = await dexieDB.backups.count();
      if(count > DEXIE_MAX_BACKUPS){ const excess = count - DEXIE_MAX_BACKUPS; const oldest = await dexieDB.backups.orderBy('timestamp').limit(excess).toArray(); await dexieDB.backups.bulkDelete(oldest.map(x => x.id)); }
    }
  } catch(e){}
}
async function loadFromDexie(){ if(!dexieDB) return null; try { const saved = await dexieDB.saved.get('current'); if(!saved || !saved.data) return null; return { data: JSON.parse(saved.data), timestamp: saved.timestamp }; } catch(e){ return null; } }

function applyFileToDB(target, fileKey, data){ switch(fileKey){ case 'settings': target.settings = deepMerge(structuredClone(DEFAULT_SETTINGS), data||{}); break; case 'materials': target.materials = normalizeMaterials(Array.isArray(data)?data:[]); break; case 'pricing': target.pricing = normalizePricing(Array.isArray(data)?data:[]); break; case 'daily': target.sales = normalizeSales(data); break; case 'expenses': target.expenses = normalizeExpenses(Array.isArray(data)?data:[]); break; case 'transfers': target.transfers = normalizeTransfers(data); break; case 'monthly': target.monthly = Array.isArray(data) ? data : (data?.periods || []); break; case 'annual': target.annual = Array.isArray(data) ? data : (data?.periods || []); break; } }

  const fresh = emptyDB(); const loaded = [], failed = [];
  results.forEach((res, i) => { const name = files[i]; if(res.status === 'fulfilled'){ applyFileToDB(fresh, DATA_FILES[name], res.value); loaded.push(name); } else { failed.push(name); } });
  fresh._meta = { loadedFrom:'files', loadedAt:new Date().toISOString(), loadedFiles: loaded };
  return { db: fresh, loaded, failed };
}

function getMaterialCost(name){ if(!name) return 0; const m = db.materials.find(x => x.name.trim().toLowerCase() === String(name).trim().toLowerCase()); if(!m) return 0; if(m.ft <= 0) return 0; const raw = m.price / (150 * m.ft); return Math.round(raw * 100) / 100; }
function legacyPaymentsFor(s, debitCash){ if(!s.mop) return []; return [{ mop:s.mop, amount: debitCash }]; }
function getSalePayments(s, debitCash){ if(Array.isArray(s.payments) && s.payments.length) return s.payments; return legacyPaymentsFor(s, debitCash); }
function computeSale(s){
  const cfg = getSettings().rates;
  const credit = +s.credit || 0; const fees = +s.fees || 0; const wht = +s.withholding || 0; const disc = +s.discount || 0;
  const debitCash = +(credit - fees - wht - disc).toFixed(2);
  const addCost = +s.additionalCost || 0;
  const w = +s.width || 0, h = +s.height || 0; const dw = +s.damageWidth || 0, dh = +s.damageHeight || 0;
  const costPerSqft = getMaterialCost(s.materialName);
  const isBenta = s.source === 'Benta Sa Baba';

/* ============================================================
   AGGREGATION
============================================================ */
function filterByRange(items,start,end){ return items.filter(x => x.date && x.date >= start && x.date <= end); }
function aggregateByKey(sales, expenses, keyFn){
  const map={};
  const ensure=(k)=>{ if(!map[k]) map[k]={ key:k, particulars:new Set(), pending:0, expense:0, abonoBy:0, credit:0, fees:0, wht:0, discount:0, debitCash:0, totalMaterialCost:0, lessBenta35:0, lessInk:0, lessElec:0, profit:0, saTaas:0, bentaBaba:0 }; return map[k]; };
  sales.forEach(s=>{
    if(isTransfer(s)) return; if(s.cancelled) return;
    const c = computeSale(s); const k = keyFn(s.date); const r = ensure(k);
    if(s.particulars) r.particulars.add(s.particulars);
    r.pending += +s.pending || 0;
    if(c.status !== 'Fully Paid') return;
    r.credit += c.credit; r.fees += c.fees; r.wht += c.withholding; r.discount += c.discount;
    r.debitCash += c.debitCash; r.totalMaterialCost += c.totalMaterialCost;
    r.lessBenta35 += c.lessBenta35; r.lessInk += c.lessInk; r.lessElec += c.lessElec;
    r.profit += c.profit;
    if(s.source==='Benta Sa Baba') r.bentaBaba += c.profit; else r.saTaas += c.profit;
  });
  expenses.forEach(e=>{ const k = keyFn(e.date); const r = ensure(k); if(e.particulars) r.particulars.add(e.particulars); r.expense += +e.amount || 0; });
  return Object.values(map).map(r=>({ ...r, particulars:[...r.particulars].join(', ') })).sort((a,b)=>a.key.localeCompare(b.key));
}
function sumTotals(rows){
  return rows.reduce((acc,r)=>{ acc.pending += r.pending; acc.expense += r.expense; acc.abonoBy += r.abonoBy; acc.credit += r.credit; acc.fees += r.fees; acc.wht += r.wht; acc.discount += r.discount; acc.debitCash += r.debitCash; acc.totalMaterialCost += r.totalMaterialCost; acc.lessBenta35 += r.lessBenta35; acc.lessInk += r.lessInk; acc.lessElec += r.lessElec; acc.profit += r.profit; acc.saTaas += r.saTaas; acc.bentaBaba += r.bentaBaba; return acc; },{ pending:0, expense:0, abonoBy:0, credit:0, fees:0, wht:0, discount:0, debitCash:0, totalMaterialCost:0, lessBenta35:0, lessInk:0, lessElec:0, profit:0, saTaas:0, bentaBaba:0 });
}

    if(isTransfer(s)) return; if(s.source === 'Expenses!') return; if(s.status !== 'Fully Paid') return;
    const isBenta = s.source === 'Benta Sa Baba';
    if(isBenta){ bentaCredits += s.credit; matBabaAlloc += s.credit * (rates.bentaSaBabaProfit || 0); bentaProfit += s.credit * (rates.bentaSaBabaOwner || 0); }
    else { matTaasAlloc += s.totalMaterialCost; inkAlloc += s.credit * (rates.inkPercent || 0); elecAlloc += s.credit * (rates.electricityPercent || 0); regularProfit += s.profit; }
  });
  const cat = { matBaba:0, matTaas:0, ink:0, elec:0, profit:0 };
  expenses.forEach(e => { const c = e.category || ''; const amt = +e.amount || 0; if(c === 'Materials (Baba)') cat.matBaba += amt; else if(c === 'Materials') cat.matTaas += amt; else if(c === 'Ink') cat.ink += amt; else if(c === 'Electricity') cat.elec += amt; else cat.profit += amt; });

  const bentaRemain = bentaProfit; const profitRemain = regularProfit - cat.profit;
  const totalRemaining = matBabaRemain + matTaasRemain + inkRemain + elecRemain + bentaRemain + profitRemain;
  const totalAlloc = matBabaAlloc + matTaasAlloc + inkAlloc + elecAlloc + bentaProfit + regularProfit;
  const totalSpent = cat.matBaba + cat.matTaas + cat.ink + cat.elec + cat.profit;
  return { rates, bentaCredits, matBabaAlloc, matTaasAlloc, inkAlloc, elecAlloc, bentaProfit, regularProfit, cat, matBabaRemain, matTaasRemain, inkRemain, elecRemain, bentaRemain, profitRemain, totalRemaining, totalAlloc, totalSpent };
}

function exportStyledExcel(){
  if(typeof XLSX === 'undefined'){ toast('❌ xlsx-js-style library not loaded.', 'error'); return; }
  try {
    toast('⏳ Building styled Excel workbook...', 'info');
    const wb = buildStyledWorkbook();
    const wbout = XLSX.write(wb, { bookType:'xlsx', type:'array', cellStyles:true });
    const blob = new Blob([wbout], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const name = `Artiiah Sales & Expenses ${todayStr()}.xlsx`;
    downloadBlob(blob, name);
    toast('📊 Styled Excel exported!', 'success');
  } catch(e){ console.error(e); toast('❌ Export failed: ' + e.message, 'error'); }
}

function viewGroup1_Balances(){

  const mopSet = new Set();
  sales.forEach(s=> (s.payments||[]).forEach(p=>{ if(p.mop && p.mop.trim()) mopSet.add(p.mop.trim()); }));
  expenses.forEach(e=>{ if(e.mop && e.mop.trim()) mopSet.add(e.mop.trim()); });
  transfers.forEach(t=>{ if(t.fromMOP && t.fromMOP.trim()) mopSet.add(t.fromMOP.trim()); if(t.toMOP && t.toMOP.trim()) mopSet.add(t.toMOP.trim()); });
  const mops = [...mopSet].sort();
  const balances = mops.map(mop=>{
    const dc = sales.reduce((sum,s)=> sum + (s.payments||[]).filter(p=> (p.mop||'').trim() === mop).reduce((a,p)=> a + (+p.amount||0), 0), 0);
    const exp = expenses.filter(e=>(e.mop||'').trim()===mop).reduce((sum,e)=>sum+(+e.amount||0),0);
    const tIn = transfers.filter(t=>(t.toMOP||'').trim()===mop).reduce((sum,t)=>sum+(+t.amount||0),0);
    const tOut = transfers.filter(t=>(t.fromMOP||'').trim()===mop).reduce((sum,t)=>sum+(+t.amount||0),0);

  }).join('');

    { label:`${labels.electricity}`, value:b.elecRemain, sub:`${(rates.electricityPercent*100).toFixed(0)}% regular credits`, color:'#a855f7' },

          <div class="verify-banner ${splitOK?'ok':'warn'}"><b>${splitOK ? '✓' : '⚠️'}</b> MOP Split ${peso(splitTotal)} · Debit ${peso(totalDC)}${splitOK?'':` · Diff ${peso(splitDiff)}`}</div>

}

function getSalesLayout(){
  const mob = typeof window !== 'undefined' && window.innerWidth <= 960;
  if(mob){
    return { mob: true, widths: { chk:28, id:64, month:44, day:32, cust:96, src:80, part:110, inv:64 }, lefts: { chk:0, id:28, cust:92 } };
  }
  return { mob: false, widths: { chk:34, id:78, month:48, day:38, cust:130, src:110, part:140, inv:85 }, lefts: { chk:0, id:34, month:112, day:160, cust:198, src:328, part:438, inv:578 } };
}
function isSalesColFrozen(col){
  const mob = typeof window !== 'undefined' && window.innerWidth <= 960;
  if(mob) return col === 'chk' || col === 'id' || col === 'cust';
  return ['chk','id','month','day','cust','src','part','inv'].includes(col);
}
function salesCellAttrs(col, baseCls){
  const L = getSalesLayout();

  if(frozen){ cls.push('frz'); if(col === 'inv' && !L.mob) cls.push('frz-last'); if(col === 'cust' && L.mob) cls.push('frz-last'); left = L.lefts[col]; }

function salesTh(col, label, baseCls, widthPx){ const a = salesCellAttrs(col, baseCls); const styles = []; if(widthPx) styles.push(`width:${widthPx}px;min-width:${widthPx}px`); if(a.left !== null) styles.push(`left:${a.left}px`); return `<th class="${a.cls}"${styles.length ? ` style="${styles.join(';')}"` : ''}>${label}</th>`; }
function getVisibleSalesList(){
  const all = computed().filter(s=>!isTransfer(s));
  const indexMap = new Map(); db.sales.forEach((s, i) => indexMap.set(s.id, i));
  const q = (searchQuery.sales||'').toLowerCase();
  let list = q ? all.filter(s=>[s.customerName, s.source, s.particulars, s.mop, s.serviceInvoiceNo, s.date, s.remarks, s.account, (s.mopList||[]).join(' '), s.txnId].join(' ').toLowerCase().includes(q)) : all;
  const by = salesSort.by, dir = salesSort.dir === 'asc' ? 1 : -1;
  list.sort((a,b)=>{ let cmp = 0; if(by === 'date'){ cmp = (a.date||'').localeCompare(b.date||''); } else if(by === 'customerName'){ cmp = (a.customerName||'').toLowerCase().localeCompare((b.customerName||'').toLowerCase()); } else if(by === 'credit'){ cmp = (+a.credit||0) - (+b.credit||0); } else if(by === 'profit'){ cmp = (+a.profit||0) - (+b.profit||0); } else if(by === 'source'){ cmp = (a.source||'').toLowerCase().localeCompare((b.source||'').toLowerCase()); } if(cmp !== 0) return cmp * dir; return (indexMap.get(b.id) ?? 0) - (indexMap.get(a.id) ?? 0); });
  return list;
}

mpty-title">Walang transfers pa</div><div style="margin-top:8px;font-size:12px">Click "+ New Transfer" sa itaas para mag-record.</div></div></td></tr>`}</tbody></table></div></div>`;

function exportTransfersCSV(){

function syncStickerStateFromUI(){
  const gv = (id, isNum=true, def=0) => { const el = document.getElementById(id); if(!el) return def; return isNum ? (parseFloat(el.value)||0) : el.value; };
  const gc = (id) => { const el = document.getElementById(id); return el ? el.checked : false; };

  s.spacingMode = gv('est-spacingMode', false, 'same');
  s.spacing = gv('est-spacing'); s.spacingH = gv('est-spacingH'); s.spacingV = gv('est-spacingV');
  s.centerV = gc('est-centerV'); s.centerH = gc('est-centerH');
  s.mTop = gv('est-mTop'); s.mRight = gv('est-mRight'); s.mBottom = gv('est-mBottom'); s.mLeft = gv('est-mLeft');
  s.pricePerSticker = gv('est-priceSticker');
  s.useRollCost = gc('est-useRoll');
  s.rollWidthFt = gv('est-rollW'); s.rollLengthM = gv('est-rollL'); s.rollUsableLengthFt = gv('est-rollUsable'); s.rollPrice = gv('est-rollPrice');
  s.inkPct = gv('est-ink'); s.elecPct = gv('est-elec'); s.goalProfit = gv('est-goalProfit');
  s.minPages = gv('est-minPages'); s.numPages = gv('est-numPages'); s.tierSize = gv('est-tierSize'); s.discountPerTier = gv('est-discountTier'); s.freeStickers = gv('est-freeStickers');
  s.exportFmt = gv('est-exportFmt', false, 'svg'); s.transparentBg = gc('est-transparent');
}
function computeSticker(){
  const s = stickerState; const cf = STICKER_UNITS[s.unit] || 1;
  const pageW = s.pageW, pageH = s.pageH;
  const sw = s.stickerW * cf, sh = s.stickerH * cf;
  const spacingH = (s.spacingMode === 'custom' ? s.spacingH : s.spacing) * cf;
  const spacingV = (s.spacingMode === 'custom' ? s.spacingV : s.spacing) * cf;
  const mT = s.mTop * cf, mR = s.mRight * cf, mB = s.mBottom * cf, mL = s.mLeft * cf;
  const availW = pageW - mL - mR; const availH = pageH - mT - mB;
  let perRow = 0, perCol = 0;
  if(sw > 0 && sh > 0 && availW > 0 && availH > 0){
    perRow = Math.max(0, Math.floor((availW + spacingH) / (sw + spacingH)));
    perCol = Math.max(0, Math.floor((availH + spacingV) / (sh + spacingV)));
  }
  const total = perRow * perCol;
  let startX = mL, startY = mT;
  if(s.centerH && perRow > 0){ const tw = perRow * sw + (perRow - 1) * spacingH; startX = mL + (availW - tw) / 2; }
  if(s.centerV && perCol > 0){ const th = perCol * sh + (perCol - 1) * spacingV; startY = mT + (availH - th) / 2; }
  const rollAreaSqft = s.rollWidthFt * s.rollUsableLengthFt;
  const pricePerSqft = rollAreaSqft > 0 ? s.rollPrice / rollAreaSqft : 0;
  const pageAreaSqft = (pageW / 12) * (pageH / 12);
  const materialCost = pageAreaSqft * pricePerSqft;
  const totalPrice = total * s.pricePerSticker;
  const inkCost = totalPrice * (s.inkPct / 100);
  const elecCost = totalPrice * (s.elecPct / 100);
  const profit = totalPrice - materialCost - inkCost - elecCost;
  const cm = 1 - (s.inkPct + s.elecPct) / 100;
  const targetRevenue = cm > 0 ? (s.goalProfit + materialCost) / cm : 0;
  const suggestedPerSticker = total > 0 ? targetRevenue / total : 0;
  const totalAll = total * s.numPages;
  const paid = Math.max(0, totalAll - s.freeStickers);
  const ratio = totalAll > 0 ? paid / totalAll : 1;
  const subtotal = paid * s.pricePerSticker;
  const tiers = Math.floor(s.numPages / s.tierSize);
  const discountPct = Math.min(tiers * s.discountPerTier, 100);
  const discountAmt = subtotal * (discountPct / 100);
  const finalTotal = subtotal - discountAmt;
  const bulkMaterial = materialCost * s.numPages * ratio;
  const bulkInk = finalTotal * (s.inkPct / 100);
  const bulkElec = finalTotal * (s.elecPct / 100);
  const bulkProfit = finalTotal - bulkMaterial - bulkInk - bulkElec;
  const setText = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };
  setText('est-total', total);
  setText('est-perRow', perRow);
  setText('est-perCol', perCol);
  setText('est-area', (availW * availH).toFixed(2) + ' in²');
  setText('est-size', sw.toFixed(2) + ' x ' + sh.toFixed(2) + ' in');
  const ct = []; if(s.centerV) ct.push('Vertical'); if(s.centerH) ct.push('Horizontal');
  setText('est-center', ct.length > 0 ? ct.join(' & ') : 'None');
  setText('est-rollArea', rollAreaSqft.toFixed(2) + ' sq.ft');
  setText('est-priceSqft', '₱' + pricePerSqft.toFixed(2));
  setText('est-matSheet', '₱' + materialCost.toFixed(2));
  setText('est-totalPrice', peso(totalPrice));
  setText('est-pricePage', peso(totalPrice));
  setText('est-sheetMat', '-₱' + materialCost.toFixed(2));
  setText('est-inkCost', '-₱' + inkCost.toFixed(2));
  setText('est-elecCost', '-₱' + elecCost.toFixed(2));
  setText('est-profit', peso(profit));
  setText('est-suggestPiece', peso(suggestedPerSticker));
  setText('est-suggestSheet', peso(targetRevenue));
  setText('est-bulkTotal', totalAll);
  setText('est-bulkPaid', paid);
  setText('est-bulkBase', peso(subtotal));
  setText('est-tiers', tiers);
  setText('est-discPct', discountPct.toFixed(1) + '%');
  setText('est-discAmt', '-₱' + discountAmt.toFixed(2));
  setText('est-finalTotal', peso(finalTotal));
  setText('est-bulkMat', '-₱' + bulkMaterial.toFixed(2));
  setText('est-bulkInk', '-₱' + bulkInk.toFixed(2));
  setText('est-bulkElec', '-₱' + bulkElec.toFixed(2));
  setText('est-bulkProfit', peso(bulkProfit));
  const hint = document.getElementById('est-bulkHint'); if(hint) hint.textContent = `Every ${s.tierSize} pages reduces by ${s.discountPerTier}%. Tiers: ${tiers}`;
  const previewBox = document.getElementById('est-previewBox'); const pagePreview = document.getElementById('est-pagePreview');
  if(previewBox && pagePreview){
    const rect = previewBox.getBoundingClientRect();
    const maxW = (rect.width > 0 ? rect.width : 400) - 44;
    const maxH = (rect.height > 0 ? rect.height : 380) - 44;
    const scale = Math.min(maxW / pageW, maxH / pageH);
    pagePreview.style.width = (pageW * scale) + 'px';
    pagePreview.style.height = (pageH * scale) + 'px';
    pagePreview.innerHTML = '';
    for(let row = 0; row < perCol; row++){
      for(let col = 0; col < perRow; col++){
        const sticker = document.createElement('div');
        sticker.className = 'est-sticker';
        if(s.shape === 'circle') sticker.classList.add('circle');
        else if(s.shape === 'custom') sticker.classList.add('custom');
        else if(s.shape === 'image'){ sticker.classList.add('image-shape'); if(s.imageData) sticker.style.backgroundImage = `url(${s.imageData})`; }
        const x = startX + col * (sw + spacingH);
        const y = startY + row * (sh + spacingV);
        sticker.style.left = (x * scale) + 'px';
        sticker.style.top = (y * scale) + 'px';
        sticker.style.width = (sw * scale) + 'px';
        sticker.style.height = (sh * scale) + 'px';
        pagePreview.appendChild(sticker);
      }
    }
  }
  s._computed = { sw, sh, spacingH, spacingV, startX, startY, perRow, perCol, pageW, pageH };
}
function handleStickerExport(){
  const s = stickerState; const c = s._computed; if(!c) return;
  const fmt = s.exportFmt; const transparent = s.transparentBg;
  if(fmt === 'svg'){
    const DPI = 96; const w = c.pageW * DPI, h = c.pageH * DPI;
    let bg = transparent ? '' : `<rect x="0" y="0" width="${w}" height="${h}" fill="#ffffff"/>`;
    let shapes = '';
    for(let row = 0; row < c.perCol; row++){
      for(let col = 0; col < c.perRow; col++){
        const x = (c.startX + col * (c.sw + c.spacingH)) * DPI;
        const y = (c.startY + row * (c.sh + c.spacingV)) * DPI;
        const sw = c.sw * DPI, sh = c.sh * DPI;
        if(s.shape === 'circle') shapes += `<ellipse cx="${x + sw/2}" cy="${y + sh/2}" rx="${sw/2}" ry="${sh/2}" fill="#5b5bf6" stroke="#3730a3" stroke-width="2"/>`;
        else shapes += `<rect x="${x}" y="${y}" width="${sw}" height="${sh}" rx="4" fill="#5b5bf6" stroke="#3730a3" stroke-width="2"/>`;
      }
    }
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${bg}${shapes}</svg>`;
    downloadBlob(new Blob([svg], { type:'image/svg+xml' }), 'sticker-layout.svg');
    toast('⬇️ SVG exported!', 'success');
  } else {
    const DPI = 150; const canvas = document.createElement('canvas');
    canvas.width = Math.round(c.pageW * DPI); canvas.height = Math.round(c.pageH * DPI);
    const ctx = canvas.getContext('2d');
    if(!transparent){ ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
    const draw = (img) => {
      for(let row = 0; row < c.perCol; row++){
        for(let col = 0; col < c.perRow; col++){
          const x = (c.startX + col * (c.sw + c.spacingH)) * DPI;
          const y = (c.startY + row * (c.sh + c.spacingV)) * DPI;
          const sw = c.sw * DPI, sh = c.sh * DPI;
          if(s.shape === 'image' && img){ ctx.drawImage(img, x, y, sw, sh); }
          else if(s.shape === 'circle'){ ctx.beginPath(); ctx.ellipse(x + sw/2, y + sh/2, sw/2, sh/2, 0, 0, Math.PI*2); ctx.fillStyle = '#5b5bf6'; ctx.strokeStyle = '#3730a3'; ctx.lineWidth = 2; ctx.fill(); ctx.stroke(); }
          else { ctx.fillStyle = '#5b5bf6'; ctx.strokeStyle = '#3730a3'; ctx.lineWidth = 2; ctx.fillRect(x, y, sw, sh); ctx.strokeRect(x, y, sw, sh); }
        }
      }
      canvas.toBlob((blob) => { if(blob){ downloadBlob(blob, 'sticker-layout.png'); toast('⬇️ PNG exported!', 'success'); } });
    };
    if(s.shape === 'image' && s.imageData){ const img = new Image(); img.onload = () => draw(img); img.src = s.imageData; }
    else draw(null);
  }
}

function computeTarpaulin(){
  const t = tarpState;
  const toInches = (v, u) => { switch(u){ case 'in': return v; case 'cm': return v / 2.54; case 'ft': return v * 12; default: return v; } };
  const toFtCeil = (inches) => Math.ceil(inches / 12);
  const wIn = toInches(t.width, t.unit);
  const hIn = toInches(t.height, t.unit);
  const wFt = toFtCeil(wIn);
  const hFt = toFtCeil(hIn);
  const area = wFt * hFt;
  const total = area * t.pricePerSqft;
  const unitLabel = { in:'in', cm:'cm', ft:'ft' }[t.unit];
  const setText = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };
  setText('tarp-widthIn', t.width + ' ' + unitLabel + ` (${wIn.toFixed(2)} in)`);
  setText('tarp-heightIn', t.height + ' ' + unitLabel + ` (${hIn.toFixed(2)} in)`);
  setText('tarp-widthFt', wFt + ' ft');
  setText('tarp-heightFt', hFt + ' ft');
  setText('tarp-area', area + ' sq.ft');
  setText('tarp-pps', peso(t.pricePerSqft));
  setText('tarp-total', peso(total));
}

function toast(msg, type='info'){
  const el = document.createElement('div'); el.className = `toast ${type}`;
  const icons = { success:'<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>', error:'<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>', info:'<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>' };
  el.innerHTML = `${icons[type]||icons.info}<span>${msg}</span>`;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(32px)'; el.style.transition='all .35s var(--ease)'; }, 2400);
  setTimeout(()=> el.remove(), 2800);
}
function buildSnapshot(period){ const keyFn = period === 'monthly' ? (d => d.slice(0,7)) : (d => d.slice(0,4)); const rows = aggregateByKey(db.sales, db.expenses, keyFn); return { generated: new Date().toISOString(), period, periods: rows }; }
function buildAllFiles(){
  const salesCol = { _format:'columnar', fields:SALE_FIELDS, records: db.sales.map(s=> SALE_FIELDS.map(f=> f==='payments' ? JSON.stringify(s.payments||[]) : (s[f] ?? ''))) };

  return [ ['settings.json', db.settings], ['materials.json', db.materials], ['pricing.json', db.pricing], ['dailyrecord.json', salesCol], ['expensesrecord.json', db.expenses], ['transfersrecord.json', transfersCol], ['monthlyrecord.json', buildSnapshot('monthly')], ['annualrecord.json', buildSnapshot('annual')] ];
}
async function downloadAllJSONs(){

  toast(`⬇ Downloaded ${files.length} JSON files`, 'success');
}

  const sRows = sales.map(s=>{ const split = (s.payments||[]).map(p=>`${p.mop}: ${(+p.amount||0).toFixed(2)}`).join(' | '); return [s.txnId,s.date,s.customerName,s.source,s.particulars,s.serviceInvoiceNo,s.mop,split,s.account,s.pending,s.expense,s.expensesLessTo,s.abonoBy,s.credit,s.fees,s.withholding,s.discount,s.debitCash,s.materialName,(s.costPerSqft||0).toFixed(2),s.additionalCost,s.width,s.height,s.damageWidth||0,s.damageHeight||0,s.totalMaterialCost.toFixed(2),s.lessBenta35.toFixed(2),s.lessInk.toFixed(2),s.lessElec.toFixed(2),s.profit.toFixed(2),s.amountPaid,s.balance,s.status, s.cancelled?'YES':'', s.cancelledAt||'', s.cancelReason||'', s.remarks]; });
  const salesCSV = [sHeaders, ...sRows].map(r => r.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const eHeaders = ['ID','Date','Particulars','Category','MOP','Amount','Remarks'];
  const eRows = db.expenses.map(e=>[e.txnId, e.date, e.particulars, e.category, e.mop, e.amount, e.remarks||'']);
  const expCSV = [eHeaders, ...eRows].map(r => r.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const tHeaders = ['ID','Date','From MOP','To MOP','Amount','Remarks'];
  const tRows = (db.transfers||[]).map(t=>[t.txnId, t.date, t.fromMOP, t.toMOP, t.amount, t.remarks||'']);
  const tCSV = [tHeaders, ...tRows].map(r => r.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const combined = `=== SALES ===\n${salesCSV}\n\n=== EXPENSES ===\n${expCSV}\n\n=== TRANSFERS ===\n${tCSV}`;
  downloadBlob(new Blob(['\uFEFF' + combined], {type:'text/csv;charset=utf-8'}), `Artiiah Full Export ${todayStr()}.csv`);
  toast('⬇ Exported Full Data', 'success');

function downloadBlob(content, name){
  const blob = content instanceof Blob ? content : new Blob([content]);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();
  setTimeout(()=> URL.revokeObjectURL(url), 200);
}

function updateBrandSlot(key, dataUrl){
  const slot = document.querySelector(`.brand-slot[data-key="${key}"]`);
  const preview = document.querySelector(`.brand-slot-preview[data-preview="${key}"]`);
  const status = document.querySelector(`.brand-slot-status[data-status="${key}"]`);
  if (!slot || !preview || !status) return;

    slot.classList.add('loaded');

    preview.innerHTML = emoji;
    status.textContent = 'Not loaded — click to upload';

function updateBrandSummary(){
  const loaded = BRAND_KEYS.filter(k => brandStore[k]).length;
  const total = BRAND_KEYS.length;
  const panel = document.getElementById('brandPanel');
  const summary = document.getElementById('brandStatusSummary');
  if (!panel || !summary) return;
  if (loaded === total) {
    panel.classList.add('all-loaded');
    summary.innerHTML = `<span class="ok-count">✅ All ${total} brand assets loaded</span>`;
  } else {
    panel.classList.remove('all-loaded');

  }

function bindBrandUpload(inputId, key){
  const el = document.getElementById(inputId); if (!el) return;
  el.addEventListener('change', (e) => {
    const file = e.target.files[0]; if (!file) return;
    if (key === 'bg') {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const dataUrl = ev.target.result;
        if (setStoredBrand(key, dataUrl)) {
          brandStore[key] = dataUrl;
          updateBrandSlot(key, dataUrl);
          updateBrandSummary();
        }
      };
      reader.onerror = () => alert('Failed to read background file.');

  });

function resizeImage(file, maxW, maxH){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxW || h > maxH) { const ratio = Math.min(maxW / w, maxH / h); w *= ratio; h *= ratio; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = () => resolve(e.target.result);
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function gatherQuoteData(){
  const val = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const customerName = val('quoteCustomerName');
  const customerLabel = val('quoteCustomerLabel');
  const address = val('quoteAddress');
  const contact = val('quoteContact');
  const email = val('quoteEmail');
  const businessNo = val('quoteBusinessNo') || '8419606';
  const tin = val('quoteTin') || '2022-066-860-00000';
  if(!customerName){ alert('Please enter the customer name.'); const el = document.getElementById('quoteCustomerName'); if(el) el.focus(); return null; }
  if(quoteItems.length === 0){ alert('Please add at least one item.'); return null; }
  const invalid = quoteItems.some(it => !it.qty || it.qty <= 0 || !it.size);
  if(invalid){ alert('Please fill in all item quantities and sizes.'); return null; }
  const today = new Date(); const validUntil = new Date(); validUntil.setDate(validUntil.getDate() + 7);
  return {
    businessNo, tin,
    customerName, customerLabel, address, contact, email,
    dateIssued: quoteFormatDateLong(today),
    validUntil: quoteFormatDateLong(validUntil),
    items: quoteItems,
    designImages: quoteDesignImages.slice(),
    payments: quotePayments.map(p => ({
      type: p.type || 'Payment',
      account: p.account || '',
      name: p.name || '',
      logo: p.logo || null
    })),
    brandLogo: brandStore.logo, brandBg: brandStore.bg
  };
}

function renderDesignPreview(){
  const box = document.getElementById('designPreviewBox');
  if(!box) return;
  if(!quoteDesignImages.length){ box.innerHTML = '<span class="placeholder">No design image uploaded yet</span>'; return; }
  box.innerHTML = quoteDesignImages.map((src, i) => `
    <div style="position:relative; display:inline-block; margin:4px; vertical-align:top;">
      <img src="${src}" style="max-width:100%; max-height:100px; object-fit:contain; display:block; border:1px solid #ddd; border-radius:4px; padding:2px; background:#fff;">
      <button type="button" onclick="removeDesignImage(${i})" title="Remove" style="position:absolute; top:-6px; right:-6px; background:#ef4444; color:#fff; border:none; border-radius:50%; width:20px; height:20px; cursor:pointer; font-size:11px; line-height:20px; padding:0; text-align:center; font-weight:700;">✕</button>
    </div>
  `).join('');
}
function removeDesignImage(i){ quoteDesignImages.splice(i, 1); renderDesignPreview(); }

function previewQuotation(){
  const data = gatherQuoteData();
  if(!data) return;
  const html = buildQuotationHTML(data);
  const overlay = document.createElement('div');
  overlay.className = 'quote-preview-overlay';
  overlay.innerHTML = `
    <div class="quote-preview-head">
      <div class="quote-preview-title">👁️ Quotation Preview</div>
      <div class="quote-preview-actions">
        <button type="button" class="btn btn-ghost" data-act="close">✕ Close</button>
        <button type="button" class="btn btn-primary" data-act="generate">📄 Generate PDF</button>
      </div>
    </div>
    <div class="quote-preview-scroll">
      <div class="quote-preview-frame" id="quotePreviewFrame">
        <div class="quote-preview-scaler" id="quotePreviewScaler">${html}</div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const fit = () => {
    const scroll = overlay.querySelector('.quote-preview-scroll');
    const frame = overlay.querySelector('#quotePreviewFrame');
    const scaler = overlay.querySelector('#quotePreviewScaler');
    if(!scroll || !frame || !scaler) return;
    const availW = Math.max(200, scroll.clientWidth - 40);
    const a4w = 794, a4h = 1119;
    const scale = Math.min(1, Math.max(0.2, availW / a4w));
    scaler.style.transformOrigin = 'top left';
    scaler.style.transform = `scale(${scale})`;
    frame.style.width = (a4w * scale) + 'px';
    frame.style.height = (a4h * scale) + 'px';
  };
  requestAnimationFrame(fit);
  window.addEventListener('resize', fit);
  const cleanup = () => { window.removeEventListener('resize', fit); overlay.remove(); };
  overlay.querySelector('[data-act="close"]').onclick = cleanup;
  overlay.querySelector('[data-act="generate"]').onclick = () => { cleanup(); generateQuotationPDF(); };
  overlay.addEventListener('click', (e) => { if(e.target === overlay) cleanup(); });
}

    <div class="form-grid">
      <div class="field"><label>Customer Name *</label><input type="text" id="quoteCustomerName" placeholder="Ron Ranit"></div>
      <div class="field"><label>Contact</label><input type="text" id="quoteContact" placeholder="0912 345 6789"></div>
      <div class="field"><label>Address</label><input type="text" id="quoteAddress" placeholder="123 St., Manila"></div>
      <div class="field"><label>Email</label><input type="email" id="quoteEmail" placeholder="customer@email.com"></div>
      <div class="field"><label>"Costumer" label</label><input type="text" id="quoteCustomerLabel" placeholder="Same as customer name if blank"></div>
    </div>

    <div class="section-title">📦 Items / Services</div>
    <div id="quoteItemsList"></div>
    <button type="button" class="btn btn-ghost btn-sm" onclick="addQuoteItem()" style="width:100%;justify-content:center;margin-top:8px;">+ Add Item / Service</button>

    <div class="section-title">🖼️ Design Image for PDF (multiple allowed)</div>
    <div class="field">
      <label>Upload Design Image(s) — each appears in the DESIGN section</label>
      <input type="file" id="quoteDesignUpload" accept="image/*" multiple>
      <div class="design-upload-preview" id="designPreviewBox"><span class="placeholder">No design image uploaded yet</span></div>
    </div>

    <div class="section-title">🏢 Business Information</div>
    <div class="form-grid">
      <div class="field"><label>Business Name No.</label><input type="text" id="quoteBusinessNo" value="8419606"></div>
      <div class="field"><label>TIN</label><input type="text" id="quoteTin" value="2022-066-860-00000"></div>
    </div>

    <div class="section-title">💳 Payment Methods</div>
    <div id="quotePaymentsList"></div>
    <button type="button" class="btn btn-ghost btn-sm" onclick="addQuotePayment()" style="width:100%;justify-content:center;margin-top:8px;">+ Add Payment Method</button>

    <div class="section-title">📅 Quotation Dates</div>
    <div class="form-grid">
      <div class="field"><label>Quote Issued</label><input type="text" id="quoteDateIssued" value="${quoteDateIssued}" readonly style="opacity:.75;cursor:not-allowed;"></div>
      <div class="field"><label>Valid Until (7 days)</label><input type="text" id="quoteValidUntil" value="${quoteValidUntil}" readonly style="opacity:.75;cursor:not-allowed;"></div>
    </div>
  `;
  openModal({
    title: '📄 Generate Quotation PDF',
    saveLabel: '📄 Generate PDF',
    quote: true,
    body,
    onSave: () => generateQuotationPDF()
  });
  setTimeout(() => {
    const foot = document.querySelector('#modalForm .modal-foot');
    if(foot && !document.getElementById('quotePreviewBtn')){
      const previewBtn = document.createElement('button');
      previewBtn.type = 'button';
      previewBtn.id = 'quotePreviewBtn';
      previewBtn.className = 'btn btn-ghost';
      previewBtn.innerHTML = '👁️ Preview';
      previewBtn.addEventListener('click', previewQuotation);
      foot.insertBefore(previewBtn, foot.firstChild);
    }
  }, 0);
  BRAND_KEYS.forEach(k => {
    const id = 'brandUpload' + k.charAt(0).toUpperCase() + k.slice(1);
    bindBrandUpload(id, k);
  });
  loadAllBrandFromStorage();
  renderQuoteItems();
  renderDesignPreview();
  renderQuotePayments();
  const designUp = document.getElementById('quoteDesignUpload');
  if(designUp) designUp.addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);
    if(!files.length) return;
    let remaining = files.length;
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        quoteDesignImages.push(ev.target.result);
        remaining--;
        if(remaining === 0) renderDesignPreview();
      };
      reader.onerror = () => { remaining--; if(remaining === 0) renderDesignPreview(); };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  });
}

function addQuoteItem(){ quoteItems.push(defaultQuoteItem()); renderQuoteItems(); }

async function generateQuotationPDF(){
  const btn = document.querySelector('#modalForm button[type=submit]');
  if(!btn) return;
  const data = gatherQuoteData();
  if(!data) return;
  const originalText = btn.innerHTML;
  btn.innerHTML = '⏳ Generating...'; btn.disabled = true;
  try {
    const html = buildQuotationHTML(data);
    const container = document.createElement('div');
    container.innerHTML = html;
    container.style.position = 'fixed'; container.style.left = '-9999px'; container.style.top = '0';
    container.style.width = '210mm'; container.style.height = '296mm'; container.style.background = '#ffffff';
    container.style.zIndex = '-1'; container.style.overflow = 'hidden';
    document.body.appendChild(container);
    const element = container.firstElementChild;
    const imgs = element.querySelectorAll('img');
    await Promise.all(Array.from(imgs).map(img => { if (img.complete) return Promise.resolve(); return new Promise(res => { img.onload = res; img.onerror = res; }); }));
    await new Promise(res => setTimeout(res, 250));
    const opt = {
      margin: 0,
      filename: `Quotation_${data.customerName.replace(/[^a-zA-Z0-9]/g, '_')}_${quoteFormatDateFile(new Date())}.pdf`,
      image: { type: 'png' },
      html2canvas: { scale: 4, useCORS: true, allowTaint: true, backgroundColor: '#ffffff', logging: false, width: 794, height: 1119 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css'] }
    };
    await html2pdf().set(opt).from(element).save();
    document.body.removeChild(container);
    btn.innerHTML = '✅ PDF Downloaded!';
    btn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
    setTimeout(() => { closeModal(); toast('✅ Quotation PDF generated!', 'success'); }, 900);
  } catch (e) {
    console.error('PDF generation failed:', e);
    alert('Failed to generate PDF: ' + (e.message || e));
    btn.innerHTML = originalText; btn.disabled = false;
  }
}

async function boot(){
  loadCloudConfig();

  const saved = localStorage.getItem('artiiah_theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeLabel').textContent = theme==='dark' ? 'Light Mode' : 'Dark Mode';
  if(theme==='dark') document.getElementById('themeIcon').innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  initDexie();
  if(FS_SUPPORTED){ try { const handle = await loadDirHandleFromIDB(); if(handle){ dirHandle = handle; try { const perm = await handle.queryPermission({ mode:'readwrite' }); if(perm === 'granted'){ const loaded = await loadFilesFromFolder(handle); if(loaded > 0){ afterLoad(); render(); return; } } } catch(e){} } } catch(e){} }
  if(dexieDB){ const fromDexie = await loadFromDexie(); if(fromDexie && fromDexie.data){ db = normalizeDB(fromDexie.data); db._meta = { loadedFrom:'dexie', loadedAt:new Date(fromDexie.timestamp).toISOString() }; afterLoad(); render(); return; } }
  const raw = localStorage.getItem(DB_KEY);
  if(raw){ try{ db = normalizeDB(JSON.parse(raw)); afterLoad(); render(); return; } catch(e){} }
  // Try cloud fallback for fresh device
  if(cloudConfig.enabled){
    try {
      const res = await cloudFetch('/data', { method: 'GET' });
      if (res && res.data) {
        db = normalizeDB(res.data);
        db._meta = { loadedFrom:'cloud', loadedAt: new Date().toISOString() };
        localStorage.setItem(DB_KEY, JSON.stringify(db));
        afterLoad(); render();
        toast('☁️ Loaded from Cloudflare KV', 'success');
        return;
      }
    } catch(e){}
  }
  try{ const result = await tryFetchAll(); if(result.loaded.length > 0){ db = normalizeDB(result.db); localStorage.setItem(DB_KEY, JSON.stringify(db)); afterLoad(); render(); return; } } catch(e){}
  db = emptyDB(); render();
}
boot();
